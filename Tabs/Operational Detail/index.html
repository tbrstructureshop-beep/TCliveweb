<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../api.js"></script>
    <style>
        :root { 
            --bg: #0b0e14; --panel: #151921; --border: rgba(255, 255, 255, 0.1); --accent: #0ea5e9; 
            --text-main: #94a3b8; --text-bold: #ffffff; --input-bg: rgba(255, 255, 255, 0.05);
        }
        .light {
            --bg: transparent; --panel: #ffffff; --border: #e2e8f0; --accent: #0284c7; 
            --text-main: #475569; --text-bold: #1e293b; --input-bg: #f8fafc;
        }
        body { background: transparent; color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; transition: all 0.3s ease; }
        .text-white, h1, h2, h3, h4 { color: var(--text-bold) !important; }
        
        .unit-nav { display: flex; gap: 0.5rem; padding: 0.5rem; background: rgba(0,0,0,0.2); border-radius: 1.25rem; border: 1px solid var(--border); overflow-x: auto; }
        .unit-nav::-webkit-scrollbar { display: none; }
        .unit-tab { padding: 0.75rem 1.5rem; border-radius: 1rem; font-size: 11px; font-weight: 800; white-space: nowrap; transition: 0.3s; color: var(--text-main); cursor: pointer; border: 1px solid transparent; }
        .unit-tab.active { background: var(--accent); color: white !important; box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4); border-color: rgba(255,255,255,0.2); }
        
        .op-card { background-color: var(--panel) !important; border: 1px solid var(--border) !important; border-radius: 2.5rem; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5); }
        
        .stat-box { flex: 1; min-width: 100px; padding: 12px; border-radius: 1.25rem; border: 1px solid var(--border); text-align: center; background: var(--input-bg); }
        .stat-val { display: block; font-size: 1.25rem; font-weight: 900; line-height: 1; margin-bottom: 4px; }
        .stat-lab { font-size: 8px; font-weight: 800; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; }

        .master-table { width: 100%; font-size: 11px; border-spacing: 0 8px; border-collapse: separate; }
        .master-table th { padding: 12px; text-align: left; opacity: 0.4; text-transform: uppercase; font-size: 10px; }
        .master-table td { padding: 14px 12px; background: rgba(255,255,255,0.01); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .master-table td:first-child { border-left: 1px solid var(--border); border-top-left-radius: 16px; border-bottom-left-radius: 16px; }
        .master-table td:last-child { border-right: 1px solid var(--border); border-top-right-radius: 16px; border-bottom-right-radius: 16px; }

        .input-field { background: var(--input-bg) !important; border: 1px solid var(--border) !important; color: var(--text-bold) !important; border-radius: 0.75rem; padding: 0.6rem; outline: none; font-size: 0.75rem; }
        
        #local-loader { display: none; position: fixed; inset: 0; background: rgba(11, 14, 20, 0.95); backdrop-filter: blur(10px); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .page-btn { padding: 0.6rem 1.2rem; border-radius: 0.75rem; background: var(--input-bg); border: 1px solid var(--border); font-size: 11px; font-weight: bold; transition: 0.2s; color: var(--text-bold); }
        .page-btn:hover:not(:disabled) { background: var(--accent); color: white; }
        .page-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="local-loader">
        <div class="w-12 h-12 border-4 border-sky-500/10 border-t-sky-500 rounded-full animate-spin mb-3"></div>
        <span class="text-[10px] font-mono text-sky-500 font-bold uppercase tracking-widest">Live_Database_Link...</span>
    </div>

    <!-- HEADER -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
            <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Operational Detail</h1>
            <p class="text-[10px] opacity-40 font-mono uppercase tracking-widest">Hybrid Fleet Command (Supabase Live + Sheet Engine)</p>
        </div>
        <div class="flex gap-3">
            <button onclick="init()" class="bg-white/5 border border-white/10 hover:bg-white/10 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase transition-all flex items-center gap-2">
                <i data-lucide="refresh-cw" size="14"></i> Sync All
            </button>
            <!-- 🚀 TOMBOL CREATE HOB (TAMPIL DI SEMUA UNIT) -->
            <button onclick="openHoBModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase transition-all flex items-center gap-2 shadow-lg shadow-emerald-600/20 active:scale-95">
                <i data-lucide="file-text" size="14"></i> Create HoB
            </button>
            <button id="btn-bulk" onclick="openModal('bulk')" class="bg-white/5 border border-white/10 hover:bg-white/10 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase transition-all">
                <i data-lucide="layout-grid" class="inline-block mr-1" size="14"></i> Bulk Table
            </button>
            <button id="btn-single" onclick="openModal('single')" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase transition-all">
                <i data-lucide="plus" class="inline-block mr-1" size="14"></i> Add Single
            </button>
        </div>
    </div>

    <!-- TAB NAV -->
    <div class="unit-nav-wrapper mb-8">
        <div id="unit-tabs" class="unit-nav"></div>
    </div>

    <div id="op-container"></div>

    <!-- MODAL -->
    <div id="op-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden flex items-center justify-center z-[110] p-4">
        <div class="bg-[#151921] border border-white/10 rounded-[3rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 border-b border-white/5 flex justify-between items-center text-white">
                <h3 id="modal-title" class="text-lg font-bold uppercase tracking-widest">Data Forge</h3>
                <button onclick="closeModal()" class="opacity-30 hover:opacity-100"><i data-lucide="x"></i></button>
            </div>
            <div class="p-8 space-y-4">
                <div><label class="text-[10px] font-bold uppercase mb-2 block">Assigned Node</label><select id="UnitCode" class="input-field w-full"></select></div>
                <!-- THE REAL DATA GRID TABLE -->
                <div id="bulk-container" class="hidden flex flex-col gap-3">
                    <!-- Toolbar Atas -->
                    <div class="flex justify-between items-center bg-sky-500/10 border border-sky-500/20 px-4 py-2.5 rounded-xl">
                        <div class="flex items-center gap-2 text-sky-400 text-xs font-semibold">
                            <i data-lucide="clipboard-paste" size="15"></i>
                            <span>Klik tabel & tekan <kbd class="bg-black/50 px-1.5 py-0.5 rounded border border-white/10 font-mono text-[10px] text-white">Ctrl + V</kbd> untuk paste dari Excel</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="addBlankRow()" class="px-3 py-1 bg-white/5 hover:bg-white/10 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 border border-white/10">
                                <i data-lucide="plus" size="12"></i> Add Row
                            </button>
                            <button type="button" onclick="clearBulkTable()" class="px-3 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-xs font-bold transition border border-red-500/20">
                                Clear All
                            </button>
                        </div>
                    </div>

                    <!-- Papan Tabel Utama (Bisa dipaste langsung) -->
                    <div id="bulk-grid-wrapper" tabindex="0" onpaste="handleTablePaste(event)" 
                         class="max-h-[360px] overflow-y-auto border border-white/10 rounded-2xl bg-black/40 focus:outline-none focus:border-sky-500/50 transition">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead class="bg-[#1c222c] text-[10px] uppercase font-bold text-white/60 sticky top-0 z-10 border-b border-white/10">
                                <tr>
                                    <th class="p-3 w-12 text-center">No</th>
                                    <th class="p-3 w-32">A/C Reg</th>
                                    <th class="p-3 w-36">Order No</th>
                                    <th class="p-3">Work Description</th>
                                    <th class="p-3 w-10 text-center"></th>
                                </tr>
                            </thead>
                            <tbody id="bulk-table-body" class="divide-y divide-white/5 font-mono text-xs">
                                <!-- Dynamic rows injected here -->
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="flex justify-between items-center text-[10px] text-white/40 font-mono px-2">
                        <span id="bulk-count">0 items staged</span>
                        <span>Format Kolom: AC REG [TAB] ORDER [TAB] DESCRIPTION</span>
                    </div>
                </div>
                <div id="single-container" class="grid grid-cols-2 gap-4">
                    <input type="hidden" id="primaryId">
                    <div><label class="text-[10px] font-bold uppercase mb-1 block">AC Registration</label><input id="s-ac" class="input-field w-full"></div>
                    <div><label class="text-[10px] font-bold uppercase mb-1 block">Order Number</label><input id="s-order" class="input-field w-full"></div>
                    <div class="col-span-2"><label class="text-[10px] font-bold uppercase mb-1 block">Work Description</label><input id="s-desc" class="input-field w-full"></div>
                    <div class="col-span-2"><label class="text-[10px] font-bold uppercase mb-1 block">Status</label>
                        <select id="s-status" class="input-field w-full">
                            <option>Top Urgent</option><option>Highlighted</option><option>Open</option><option>Progress</option><option>Closed</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] font-bold uppercase mb-1 block">Remark Editor</label>
                        <input id="s-remark" class="input-field w-full" placeholder="Enter custom remark...">
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-white/5">
                <button onclick="submitData()" class="w-full bg-sky-600 py-4 rounded-2xl font-black text-white text-[11px] uppercase tracking-widest">Authorize Data Entry</button>
            </div>
        </div>
    </div>

    <!-- Penampung Modal HoB Eksternal -->
    <div id="hobModalPlaceholder"></div>

    <!-- Penampung Modal Perform Job -->
    <div id="performJobModalPlaceholder"></div>

    <script>
        lucide.createIcons();
        const loader = document.getElementById('local-loader');
        const TAB_NAME = 'Operational Detail';
        
        let currentPage = 1, rowsPerPage = 10;
        let rawOpData = [], supabaseData = [], unitList = [], activeUnit = null, currentMode = 'single', bulkData = [];
        let showOnlyReported = true; // Default true
        let searchQuery = '';

        const PRIORITY = { 'Top Urgent': 0, 'Highlighted': 1, 'Open': 2, 'Progress': 3, 'Closed': 4 };

        const S_URL = 'https://tskcxblanrtvzlctpcyd.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRza2N4YmxhbnJ0dnpsY3RwY3lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwNjI0MjAsImV4cCI6MjA4MjYzODQyMH0.6epAPJdzgxe-pmG-rVtosdbg-dwF5lND6Xd18VgUeU0';
        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        // MAP SESUAI FILE W301, W302, W303 & TCP-9
        const SUPABASE_UNITS = {
            'TCR-1': { colStatus: 'status_sm1', colDate: 'date_closed_sm1', filterCek: 'cek_sm1', reportKey: 'report_sm1', remarkKey: 'remark_sm1' },
            'TCR-2': { colStatus: 'status_cs1', colDate: 'date_closed_cs1', filterCek: 'cek_cs1', reportKey: 'report_cs1', remarkKey: 'remark_cs1' },
            'TCR-5': { colStatus: 'status_mw',  colDate: 'date_closed_mw',  filterCek: 'cek_mw',  reportKey: 'report_mw',  remarkKey: 'remark_mw' },
            'TCR-3': { colStatus: 'status_sm4', colDate: 'date_closed_sm4', filterCek: 'cek_sm4', reportKey: 'report_sm4', remarkKey: 'remark_sm4' },
            'TCR-4': { colStatus: 'status_cs4', colDate: 'date_closed_cs4', filterCek: 'cek_cs4', reportKey: 'report_cs4', remarkKey: 'remark_cs4' },
            'TCP-9': { colStatus: 'status_job', colDate: null,              filterCek: null,       reportKey: 'report_pe',  remarkKey: 'remark' }
        };
        
        async function init() {
            loader.style.display = 'flex';
            try {
                const [unitRes, opRes, { data: sData, error: sErr }] = await Promise.all([
                    API.get('UNIT'),
                    API.get(TAB_NAME),
                    supabaseClient.from('mntp_tcr').select('*').eq('archived', false) // <-- 'mdr_tracking' diubah ke 'mntp_tcr'
                ]);

                if (sErr) throw sErr;
                unitList = unitRes.data || [];
                rawOpData = opRes.data || [];
                supabaseData = sData || [];

                populateAssignedNode('single');
                if(!activeUnit && unitList.length > 0) activeUnit = unitList[0].UnitCode;
                
                updateActionButtons();
                renderTabs();
                renderCards();
            } catch (e) { Swal.fire('Sync Error', e.message, 'error'); } 
            finally { loader.style.display = 'none'; }
        }

        function renderTabs() {
            document.getElementById('unit-tabs').innerHTML = unitList.map(u => 
                `<button onclick="switchUnit('${u.UnitCode}')" class="unit-tab ${u.UnitCode === activeUnit ? 'active' : ''}">
                    ${u.UnitCode}
                </button>`).join('');
        }

        function renderCards() {
            const container = document.getElementById('op-container');
            let fullData = [];
            const sMap = SUPABASE_UNITS[activeUnit];

            // AMBIL DATA DESKRIPSI & LEADER DARI unitList
            const activeUnitData = unitList.find(u => u.UnitCode === activeUnit) || {};
            const unitDesc = activeUnitData.UnitDesc || 'No Description';
            const unitLeader = activeUnitData.UnitLeader || 'Unassigned';

            // Ambil daftar order TCP-9 yang tersimpan di LocalStorage
            const tcp9CheckedList = getTCP9CheckedOrders();

            if (sMap) {
                // --- LOGIKA SUPABASE (TCR & TCP-9) ---
                const reportKey = sMap.reportKey || (activeUnit === 'TCR-2' ? 'report_cs1' : activeUnit === 'TCR-3' ? 'report_sm4' : activeUnit === 'TCR-4' ? 'report_cs4' : activeUnit === 'TCR-5' ? 'report_mw' : 'report_sm1');
                const remarkKey = sMap.remarkKey || (activeUnit === 'TCP-9' ? 'remark' : activeUnit === 'TCR-2' ? 'remark_cs1' : activeUnit === 'TCR-3' ? 'remark_sm4' : activeUnit === 'TCR-4' ? 'remark_cs4' : activeUnit === 'TCR-5' ? 'remark_mw' : 'remark_sm1');
            
                fullData = supabaseData
                    .filter(item => {
                        // Khusus TCP-9: Cek dari LocalStorage, unit TCR: Cek dari Supabase
                        const isReported = (activeUnit === 'TCP-9')
                            ? tcp9CheckedList.includes(String(item.order))
                            : (item[reportKey] === true || item[reportKey] === '1' || item[reportKey] === 'checked');

                        const matchReport = showOnlyReported ? isReported : true;
                        
                        const matchSearch = (
                            (item.ac_reg || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (String(item.order) || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (item.description || '').toLowerCase().includes(searchQuery.toLowerCase())
                        );
                        
                        // TCR 1-5 wajib cek 'red'. Untuk TCP-9 loloskan semua data aktif
                        const matchCek = sMap.filterCek ? (item[sMap.filterCek] === 'red') : true;

                        return matchCek && matchReport && matchSearch;
                    })
                    .map(item => {
                        const isReported = (activeUnit === 'TCP-9')
                            ? tcp9CheckedList.includes(String(item.order))
                            : (item[reportKey] === true || item[reportKey] === '1' || item[reportKey] === 'checked');
                        
                        // 🚀 FORMAT KHUSUS TCP-9
                        if (activeUnit === 'TCP-9') {
                            return {
                                ACReg: item.ac_reg || '-',
                                OrderNo: item.order ? String(item.order) : '-', 
                                Description: `
                                    <div class="py-0.5">
                                        <div class="font-bold text-white leading-tight">${item.description || '-'}</div>
                                        <div class="text-[10px] text-sky-400 font-mono mt-1 flex items-center gap-1.5 flex-wrap">
                                            <span class="bg-sky-500/15 border border-sky-500/30 px-1 py-0.5 rounded text-[9px] font-bold text-sky-300">${item.doc_type || 'DOC'}</span>
                                            <span class="opacity-30">|</span>
                                            <span>P/N: <span class="text-white/80">${item.pn || '-'}</span></span>
                                            <span class="opacity-30">|</span>
                                            <span>S/N: <span class="text-white/80">${item.sn || '-'}</span></span>
                                        </div>
                                    </div>`,
                                Status: formatStatus(item.status_job || item.status_pe || 'Open'),
                                // Remark dengan label jelas: Remark, Remark from Shop, Mat, Doc
                                Remark: `
                                    <div class="py-0.5 space-y-1">
                                        <div class="text-white/90 text-xs">
                                            <span class="text-[9px] font-bold text-sky-400 uppercase tracking-wider block">Remark:</span>
                                            <span>${item.remark || '-'}</span>
                                        </div>
                                        ${item.remark_pro ? `
                                            <div class="text-white/70 text-[10px]">
                                                <span class="text-[8px] font-bold text-purple-400 uppercase tracking-wider block">Remark from Shop:</span>
                                                <span class="italic text-white/80">${item.remark_pro}</span>
                                            </div>
                                        ` : ''}
                                        <div class="text-[10px] text-white/50 font-mono flex items-center gap-1.5 flex-wrap pt-0.5 border-t border-white/5">
                                            <span>Mat: <span class="text-emerald-400 font-bold">${item.remark_mat || '-'}</span></span>
                                            <span class="opacity-30">|</span>
                                            <span>Doc: <span class="text-amber-400 font-semibold">${item.doc_status || '-'}</span></span>
                                        </div>
                                    </div>`,
                                UnitCode: activeUnit,
                                isLive: true,
                                isReported: isReported
                            };
                        }

                        // Format reguler TCR
                        return {
                            ACReg: item.ac_reg || '-',
                            OrderNo: item.order ? String(item.order) : '-', 
                            Description: item.description || '-',
                            Status: formatStatus(item[sMap.colStatus]),
                            Remark: item[remarkKey] || '-',
                            UnitCode: activeUnit,
                            isLive: true,
                            isReported: isReported
                        };
                    });
            } else {
                // --- LOGIKA GOOGLE SHEET (TCP-10, dll) ---
                const localChecked = getUnitCheckedOrders(activeUnit);
                fullData = rawOpData
                    .filter(item => {
                        const isReported = localChecked.includes(String(item.OrderNo));
                        const matchReport = showOnlyReported ? isReported : true;
                        const matchUnit = item.UnitCode === activeUnit;
                        const matchSearch = (
                            (item.ACReg || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (String(item.OrderNo) || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (item.Description || '').toLowerCase().includes(searchQuery.toLowerCase())
                        );
                        return matchUnit && matchReport && matchSearch;
                    })
                    .map(item => ({
                        ...item,
                        Status: formatStatus(item.Status),
                        Remark: item.Remark || item.Remarks || '-',
                        isReported: localChecked.includes(String(item.OrderNo))
                    }));
            }

            window.currentRenderedData = fullData; // 👈 Tambahkan baris ini
            fullData.sort((a, b) => PRIORITY[a.Status] - PRIORITY[b.Status]);

            // Summary Stats Lengkap
            const stats = {
                total: fullData.length,
                urgent: fullData.filter(i => i.Status === 'Top Urgent').length,
                high: fullData.filter(i => i.Status === 'Highlighted').length,
                open: fullData.filter(i => i.Status === 'Open').length,
                prog: fullData.filter(i => i.Status === 'Progress').length,
                done: fullData.filter(i => i.Status === 'Closed').length
            };

            // Pagination Logic
            const limit = rowsPerPage === 'All' ? stats.total : parseInt(rowsPerPage);
            const totalPages = Math.ceil(stats.total / limit) || 1;
            if (currentPage > totalPages) currentPage = 1;
            const start = (currentPage - 1) * limit;
            const paginatedItems = fullData.slice(start, start + limit);

            container.innerHTML = `
                <div class="op-card animate-in fade-in duration-500">
                    <div class="flex flex-col xl:flex-row justify-between items-start gap-6 mb-10">
                        <!-- Bagian Kiri: Judul & Informasi Unit -->
                        <div>
                            <span class="text-[10px] font-bold uppercase text-sky-500 tracking-[0.2em] mb-1 block">
                                ${sMap ? 'Live Database (Syncing with Workshop)' : 'Cloud Spreadsheet Storage'}
                            </span>
                            <h2 class="text-4xl font-black text-white tracking-tighter uppercase leading-none">${activeUnit}</h2>
                            
                            <!-- DESKRIPSI & LEADER MUNCUL DI SINI -->
                            <div class="flex flex-wrap items-center gap-3 mt-3">
                                <span class="bg-white/5 border border-white/10 text-white/80 px-2 py-1 rounded text-[10px] font-bold uppercase tracking-widest">
                                    ${unitDesc}
                                </span>
                                <span class="flex items-center gap-1 text-[10px] font-bold uppercase tracking-widest text-sky-400">
                                    <i data-lucide="shield-check" class="w-3 h-3"></i> ${unitLeader}
                                </span>
                            </div>
                            
                            <!-- SEARCH & TOGGLE DITEMPATKAN DI SINI -->
                            <div class="flex flex-col md:flex-row gap-2 mt-5">
                                <input type="text" id="search-input" placeholder="Search AC, Order, or Desc..." 
                                    value="${searchQuery}" oninput="updateSearch(this.value)" 
                                    class="input-field w-full md:w-64">
                                
                                <button onclick="toggleReported()" class="px-4 py-2 rounded-xl text-[10px] font-bold border transition-all ${showOnlyReported ? 'bg-sky-600 border-sky-500 text-white' : 'bg-white/5 border-white/10 text-white'}">
                                    ${showOnlyReported ? 'REPORTED ONLY' : 'SHOW ALL'}
                                </button>
                            </div>
                        </div>
                        
                        <!-- Stats Grid Lengkap -->
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-2 flex-1 w-full max-w-4xl">
                            <div class="stat-box"><span class="stat-val">${stats.total}</span><span class="stat-lab">Total</span></div>
                            <div class="stat-box border-red-500/30 text-red-500"><span class="stat-val">${stats.urgent}</span><span class="stat-lab">Urgent</span></div>
                            <div class="stat-box border-purple-500/20 text-purple-400"><span class="stat-val">${stats.high}</span><span class="stat-lab">High</span></div>
                            <div class="stat-box border-blue-500/20 text-blue-400"><span class="stat-val">${stats.open}</span><span class="stat-lab">Open</span></div>
                            <div class="stat-box border-yellow-500/20 text-yellow-400"><span class="stat-val">${stats.prog}</span><span class="stat-lab">Prog</span></div>
                            <div class="stat-box border-emerald-500/20 text-emerald-400"><span class="stat-val">${stats.done}</span><span class="stat-lab">Done</span></div>
                        </div>
                    </div>

                    <!-- Pagination Controls -->

        // 🚀 HELPER LOCAL STORAGE KHUSUS CENTANG TCP-9
        function getTCP9CheckedOrders() {
            try {
                return JSON.parse(localStorage.getItem('tcp9_checked_orders') || '[]');
            } catch (e) { return []; }
        }

        function setTCP9CheckedOrders(orders) {
            localStorage.setItem('tcp9_checked_orders', JSON.stringify(orders));
        }

        // 🚀 HELPER CENTANG UNIVERSAL (TCP-9 & UNIT GOOGLE SHEET MENGGUNAKAN LOCALSTORAGE)
        function getUnitCheckedOrders(unit) {
            if (unit === 'TCP-9') {
                try { return JSON.parse(localStorage.getItem('tcp9_checked_orders') || '[]'); } catch(e) { return []; }
            }
            try { return JSON.parse(localStorage.getItem(`checked_orders_${unit}`) || '[]'); } catch(e) { return []; }
        }

        function setUnitCheckedOrders(unit, orders) {
            if (unit === 'TCP-9') {
                localStorage.setItem('tcp9_checked_orders', JSON.stringify(orders));
            } else {
                localStorage.setItem(`checked_orders_${unit}`, JSON.stringify(orders));
            }
        }

        // 🚀 FUNGSI BUKA MODAL HOB (HANYA MEMBAWA DATA YANG DICENTANG)
        async function openHoBModal() {
            // Ambil semua item yang sedang dicentang di unit aktif
            const checkedItems = (window.currentRenderedData || []).filter(item => item.isReported);

            // Validasi: Wajib centang minimal 1
            if (!checkedItems || checkedItems.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Item Belum Dipilih',
                    text: 'Silakan centang (kolom Rep.) minimal 1 order terlebih dahulu untuk membuat lembar HoB!',
                    background: '#151921',
                    color: '#fff',
                    confirmButtonColor: '#0ea5e9'
                });
                return;
            }

            // Format data agar sesuai dengan template HoB
            window.selectedHoBItems = checkedItems.map(item => {
                const rawSup = supabaseData.find(d => String(d.order) === String(item.OrderNo));
                const rawSheet = rawOpData.find(d => String(d.OrderNo) === String(item.OrderNo));
                const raw = rawSup || rawSheet || {};

                return {
                    orderNo: item.OrderNo || raw.order || raw.OrderNo || '-',
                    acReg: raw.ac_reg || raw.ACReg || item.ACReg || 'N/A',
                    Description: raw.description || raw.Description || (item.Description ? item.Description.replace(/<[^>]*>?/gm, '').trim() : '-'),
                    status: (item.Status || raw.status_job || 'OPEN').toUpperCase(),
                    partNo: raw.pn || raw.partNo || '',
                    serialNo: raw.sn || raw.serialNo || '',
                    batchNo: raw.bn || raw.batchNo || '',
                    note: raw.remark || raw.Remark || raw.remark_pro || '',
                    unit: activeUnit
                };
            });

            window.shiftReportInfo = {
                unit: activeUnit,
                date: new Date().toISOString().split('T')[0]
            };

            // Muat modal/HoB/index.html
            await loadHoBFragment();
        }

        async function loadHoBFragment() {
            const placeholder = document.getElementById('hobModalPlaceholder');
            if (!placeholder) return;
            placeholder.innerHTML = '';
            loader.style.display = 'flex';

            try {
                // 🚀 PERBAIKAN PATH: Mundur 2 folder (../../) untuk menuju TCliveweb/modal/HoB/index.html
                const res = await fetch('../../modal/HoB/index.html');
                if (!res.ok) throw new Error('File ../../modal/HoB/index.html tidak ditemukan.');
                const html = await res.text();
                placeholder.innerHTML = html;

                // Jalankan script di dalam modal
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
                lucide.createIcons();
            } catch (err) {
                Swal.fire({ title: 'Gagal Memuat HoB', text: err.message, icon: 'error', background: '#151921', color: '#fff' });
            } finally {
                loader.style.display = 'none';
            }
        }

        // 🚀 FUNGSI CENTANG REPORT (HYBRID: SUPABASE UNTUK TCR, LOCALSTORAGE UNTUK TCP-9 & SHEET)
        async function toggleReportStatus(orderNo, isChecked) {
            const sMap = SUPABASE_UNITS[activeUnit];
            const isSupabaseLiveUnit = sMap && activeUnit !== 'TCP-9';

            // 1. UNIT TCR 1 s/d 5: SIMPAN KE SUPABASE
            if (isSupabaseLiveUnit) {
                const targetRow = supabaseData.find(d => String(d.order) === String(orderNo));
                if (!targetRow || !targetRow.id || !sMap.reportKey) return;

                const val = isChecked ? 'checked' : '';
                targetRow[sMap.reportKey] = val;

                try {
                    const { error } = await supabaseClient
                        .from('mntp_tcr')
                        .update({ [sMap.reportKey]: val })
                        .eq('id', targetRow.id);
                    if (error) throw error;
                } catch (err) {
                    console.error("Gagal update centang:", err);
                    Swal.fire({ title: 'Update Gagal', text: err.message, icon: 'error', background: '#151921', color: '#fff' });
                    init();
                    return;
                }
            } else {
                // 2. TCP-9 & UNIT GOOGLE SHEET: SIMPAN DI LOCALSTORAGE
                let checkedList = getUnitCheckedOrders(activeUnit);
                const strOrder = String(orderNo);

                if (isChecked) {
                    if (!checkedList.includes(strOrder)) checkedList.push(strOrder);
                } else {
                    checkedList = checkedList.filter(o => o !== strOrder);
                }

                setUnitCheckedOrders(activeUnit, checkedList);
            }

            // 🚀 SWEETALERT TOAST NOTIFIKASI (CHECKED / UNCHECKED)
            Swal.fire({
                icon: isChecked ? 'success' : 'info',
                title: isChecked ? 'Order Checked' : 'Order Unchecked',
                text: `Order ${orderNo} ${isChecked ? 'ditambahkan ke' : 'dihilangkan dari'} reported item`,
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 1200,
                background: '#151921',
                color: '#fff'
            });

            renderCards(); // Refresh tampilan instan
        }

        async function handleUpdateStatus(uCode, oNo, status) {
            loader.style.display = 'flex';
            const sMap = SUPABASE_UNITS[uCode];
            try {
                if (sMap) {
                    // --- LOGIKA SUPABASE (TCR & TCP-9) ---
                    const payload = {};
                    
                    // 🚀 Pemetaan statusKey dinamis (termasuk TCP-9)
                    const statusKey = (uCode === 'TCP-9') ? 'status_job' :
                                      (uCode === 'TCR-4') ? 'status_cs4' : 
                                      (uCode === 'TCR-3') ? 'status_sm4' : 
                                      (uCode === 'TCR-5') ? 'status_mw' : 
                                      (uCode === 'TCR-2') ? 'status_cs1' : 'status_sm1';
                                      
                    const dateKey = (uCode === 'TCP-9') ? null :
                                    (uCode === 'TCR-4') ? 'date_closed_cs4' : 
                                    (uCode === 'TCR-3') ? 'date_closed_sm4' : 
                                    (uCode === 'TCR-5') ? 'date_closed_mw' : 
                                    (uCode === 'TCR-2') ? 'date_closed_cs1' : 'date_closed_sm1';
                    
                    payload[statusKey] = status.toUpperCase();
                    
                    // Update tanggal closed jika unit memiliki kolom dateKey
                    if (dateKey) {
                        if (status.toUpperCase() === 'CLOSED') {
                            const now = new Date();
                            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                            payload[dateKey] = `${now.getDate().toString().padStart(2,'0')}-${months[now.getMonth()]}-${now.getFullYear()}`;
                        } else {
                            payload[dateKey] = null;
                        }
                    }
        
                    const targetRow = supabaseData.find(d => String(d.order) === String(oNo));
                    if (!targetRow || !targetRow.id) throw new Error("Row ID not found for order: " + oNo);
        
                    const { error } = await supabaseClient.from('mntp_tcr').update(payload).eq('id', targetRow.id);
                    if (error) throw error;
                } else {
                    // --- LOGIKA GOOGLE SHEET (Unit lainnya) ---
                    await API.post({ 
                        tab: TAB_NAME, 
                        action: 'update', 
                        primaryId: oNo, 
                        Status: status 
                    });
                }
                await init();
            } catch (e) { 
                loader.style.display = 'none'; 
                Swal.fire('Update Error', e.message, 'error');
            }
        }
        
        async function deleteOrder(orderNo) {
            const sMap = SUPABASE_UNITS[activeUnit];
            const res = await Swal.fire({ 
                title: 'Purge Item?', 
                text: `Order akan dihilangkan dari dashboard ${activeUnit}`, // 👈 Pesan konfirmasi dinamis sesuai unit
                icon: 'warning', 
                showCancelButton: true, 
                confirmButtonColor: '#ef4444', 
                background: '#151921', 
                color: '#fff' 
            });
            
            if (res.isConfirmed) {
                loader.style.display = 'flex';
                try {
                    if (sMap) {
                        // --- LOGIKA SUPABASE (TCR & TCP-9) ---
                        if (activeUnit === 'TCP-9') {
                            // Lepas dari daftar centang TCP-9
                            let checkedList = getTCP9CheckedOrders().filter(o => o !== String(orderNo));
                            setTCP9CheckedOrders(checkedList);
                        } else {
                            // TCR 1-5 lepas tag warna di database
                            const payload = {}; 
                            if (sMap.filterCek) payload[sMap.filterCek] = '';
                            if (sMap.reportKey) payload[sMap.reportKey] = '';

                            const targetRow = supabaseData.find(d => String(d.order) === String(orderNo));
                            if (!targetRow || !targetRow.id) throw new Error("Row ID not found for order: " + orderNo);

                            const { error } = await supabaseClient.from('mntp_tcr').update(payload).eq('id', targetRow.id);
                            if (error) throw error;
                        }

                        // 🚀 SWEETALERT NOTIFIKASI HIJAU SESUAI PERMINTAAN
                        Swal.fire({
                            icon: 'success',
                            title: 'Order Dihilangkan',
                            text: `Order ${orderNo} berhasil dihilangkan dari dashboard ${activeUnit}`,
                            timer: 1500,
                            showConfirmButton: false,
                            background: '#151921',
                            color: '#fff'
                        });

                    } else {
                        // --- LOGIKA GOOGLE SHEET (Unit lainnya) ---
                        const apiRes = await API.post({ 
                            tab: TAB_NAME, 
                            action: 'delete', 
                            primaryId: orderNo 
                        });
                        
                        if (apiRes && apiRes.status !== 'success') {
                            throw new Error(apiRes.message || "Failed to delete from storage");
                        }
                    }
                    await init();
                } catch (e) { 
                    loader.style.display = 'none';
                    Swal.fire({ 
                        title: 'Error', 
                        text: e.message, 
                        icon: 'error', 
                        background: '#151921', 
                        color: '#fff' 
                    });
                }
            }
        }
        
        async function submitData() {
            loader.style.display = 'flex';
            const unit = document.getElementById('UnitCode').value;
            const sMap = SUPABASE_UNITS[unit];
            const orderNo = document.getElementById('s-order').value;
            const status = document.getElementById('s-status').value;
            const remark = document.getElementById('s-remark').value;
            
            try {
                if (currentMode === 'bulk') {
                    if (bulkData.length === 0) throw new Error("Tidak ada data untuk dimasukkan!");

                    // 🚀 JIKA TCP-9: INSERT BULK LANGSUNG KE SUPABASE
                    if (unit === 'TCP-9') {
                        const payload = bulkData.map(d => ({
                            ac_reg: d.ac,
                            order: d.order,
                            description: d.desc,
                            status_job: 'OPEN',
                            archived: false
                        }));
                        const { error } = await supabaseClient.from('mntp_tcr').insert(payload);
                        if (error) throw error;
                    } else {
                        // GOOGLE SHEET UNIT (HYBRID)
                        for(let d of bulkData) {
                            await API.post({ tab: TAB_NAME, action: 'add', UnitCode: unit, ACReg: d.ac, OrderNo: d.order, Description: d.desc, Status: 'Open', primaryId: d.order });
                        }
                    }
                } else if (currentMode === 'single' && unit === 'TCP-9') {
                    // 🚀 JIKA SINGLE ADD TCP-9 KE SUPABASE
                    const { error } = await supabaseClient.from('mntp_tcr').insert([{
                        ac_reg: document.getElementById('s-ac').value,
                        order: orderNo,
                        description: document.getElementById('s-desc').value,
                        status_job: status.toUpperCase(),
                        remark: remark,
                        archived: false
                    }]);
                    if (error) throw error;
                } else if (sMap && currentMode === 'edit') {
                    // UPDATE DATA SUPABASE (TCP-9 / TCR)
                    const payload = {}; 
                    payload[sMap.colStatus] = status.toUpperCase();
                    const rKey = (unit === 'TCP-9') ? 'remark' :
                               (unit === 'TCR-2') ? 'remark_cs1' : 
                               (unit === 'TCR-5') ? 'remark_mw' : 
                               (unit === 'TCR-3') ? 'remark_sm4' : 'remark_sm1';
                    payload[rKey] = remark;
                    
                    const targetRow = supabaseData.find(d => String(d.order) === String(orderNo));
                    if (!targetRow || !targetRow.id) throw new Error("Row ID not found for order: " + orderNo);
        
                    const { error } = await supabaseClient.from('mntp_tcr').update(payload).eq('id', targetRow.id);
                    if (error) throw error;
                } else {
                    // GOOGLE SHEET UNIT (HYBRID)
                    const action = (currentMode === 'edit' ? 'update' : 'add');
                    await API.post({ 
                        tab: TAB_NAME, 
                        action: action, 
                        UnitCode: unit, 
                        ACReg: document.getElementById('s-ac').value, 
                        OrderNo: orderNo, 
                        Description: document.getElementById('s-desc').value, 
                        Status: status, 
                        Remark: remark,
                        Remarks: remark,
                        primaryId: orderNo 
                    });
                }

                closeModal(); 
                clearBulkTable();
                await init();
                Swal.fire({ icon: 'success', title: 'Authorization Success', timer: 1000, showConfirmButton: false, background: '#151921', color: '#fff' });
            } catch (e) { 
                loader.style.display = 'none'; 
                Swal.fire('Error', e.message, 'error');
            }
        }

        function switchUnit(uCode) { 
            activeUnit = uCode; 
            currentPage = 1; 
            showOnlyReported = (uCode !== 'TCP-9');
            updateActionButtons(); // 👈 Tambahkan baris ini
            renderTabs(); 
            renderCards(); 
        }
        
        function updateRowsPerPage(val) { rowsPerPage = val; currentPage = 1; renderCards(); }
        function changePage(dir) { currentPage += dir; renderCards(); }
        function formatStatus(s) { if (!s) return 'Open'; return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

        function getStatusBadgeClass(status) {
            const statusMap = {
                'Top Urgent': 'bg-red-500/20 text-red-500 border-red-500/50',
                'Highlighted': 'bg-purple-500/20 text-purple-400 border-purple-500/50',
                'Open': 'bg-blue-500/20 text-blue-400 border-blue-500/50',
                'Progress': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/50',
                'Closed': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50'
            };
            return statusMap[status] || 'bg-gray-500/20 text-gray-400 border-gray-500/50';
        }
        
        function openModal(mode) {
            currentMode = mode; 
            document.getElementById('op-modal').classList.remove('hidden');
            document.getElementById('bulk-container').classList.toggle('hidden', mode !== 'bulk');
            document.getElementById('single-container').classList.toggle('hidden', mode === 'bulk');
            document.getElementById('s-order').disabled = (mode === 'edit');
            
            // 🚀 ISI DROPDOWN ASSIGNED NODE (TCR OTOMATIS DIBUANG)
            populateAssignedNode(mode);

            if (mode === 'bulk') {
                renderBulkTable();
                setTimeout(() => {
                    const grid = document.getElementById('bulk-grid-wrapper');
                    if (grid) grid.focus();
                }, 100);
            }
        }

        // 🚀 HILANGKAN UNIT TCR DARI DROPDOWN ASSIGNED NODE PADA BULK & SINGLE INPUT
        function populateAssignedNode(mode, currentUnit = '') {
            const select = document.getElementById('UnitCode');
            if (!select) return;

            const isTCR = (code) => ['TCR-1', 'TCR-2', 'TCR-3', 'TCR-4', 'TCR-5'].includes(code);

            // Jika Bulk atau Single Add: Saring hanya unit non-TCR (seperti TCP-9, TCP-10, dll)
            let filteredUnits = (mode === 'bulk' || mode === 'single')
                ? unitList.filter(u => !isTCR(u.UnitCode))
                : unitList;

            select.innerHTML = filteredUnits.map(u => `<option value="${u.UnitCode}">${u.UnitCode}</option>`).join('');

            // Pilih otomatis unit aktif jika valid (bukan TCR)
            if (currentUnit) {
                select.value = currentUnit;
            } else if (!isTCR(activeUnit)) {
                select.value = activeUnit;
            }
        }
        
        function closeModal() { document.getElementById('op-modal').classList.add('hidden'); bulkData = []; }
        
        // 🚀 SEMBUNYIKAN TOMBOL BULK & ADD SINGLE UNTUK TCR-1 S/D TCR-5
        function updateActionButtons() {
            const isTCR = ['TCR-1', 'TCR-2', 'TCR-3', 'TCR-4', 'TCR-5'].includes(activeUnit);
            const btnBulk = document.getElementById('btn-bulk');
            const btnSingle = document.getElementById('btn-single');
            if (btnBulk) btnBulk.style.display = isTCR ? 'none' : 'inline-flex';
            if (btnSingle) btnSingle.style.display = isTCR ? 'none' : 'inline-flex';
        }

        function handleTablePaste(e) {
            e.preventDefault();
            const raw = (e.clipboardData || window.clipboardData).getData('text');
            const rows = raw.split(/\r\n|\n/).filter(r => r.trim() !== "");
            
            const newItems = rows.map(r => {
                const cols = r.split('\t');
                return { 
                    ac: (cols[0] || '').trim(), 
                    order: (cols[1] || '').trim(), 
                    desc: (cols[2] || '').trim() 
                };
            }).filter(item => item.ac || item.order || item.desc);

            if (newItems.length === 0) return;

            bulkData = [...bulkData, ...newItems];
            renderBulkTable();

            Swal.fire({
                icon: 'success',
                title: `${newItems.length} Baris Dimasukkan ke Tabel`,
                toast: true,
                position: 'top-end',
                timer: 1500,
                showConfirmButton: false,
                background: '#151921',
                color: '#fff'
            });
        }

        function renderBulkTable() {
            const tbody = document.getElementById('bulk-table-body');
            const countSpan = document.getElementById('bulk-count');

            if (bulkData.length === 0) {
                tbody.innerHTML = `
                    <tr onclick="document.getElementById('bulk-grid-wrapper').focus()">

                            <i data-lucide="table" class="mx-auto mb-2 opacity-20 text-sky-400" size="32"></i>
                            <div class="text-xs font-semibold text-white/50">Tabel Masih Kosong</div>
                            <div class="text-[10px] text-white/30 font-mono mt-1">Klik di sini lalu tekan <kbd class="text-white/60">Ctrl + V</kbd> untuk paste baris dari Excel</div>
                        </td>
                    </tr>`;

                lucide.createIcons();
                return;
            }

                    <td class="p-1.5">
                        <input type="text" value="${d.ac || ''}" oninput="updateBulkCell(${idx}, 'ac', this.value)"

                    </td>
                    <td class="p-1.5">
                        <input type="text" value="${d.order || ''}" oninput="updateBulkCell(${idx}, 'order', this.value)" 
                            placeholder="Order #" class="w-full bg-transparent px-2.5 py-1 text-sky-400 font-mono rounded border border-transparent hover:border-white/10 focus:border-sky-500 focus:bg-black/40 outline-none text-xs">
                    </td>
                    <td class="p-1.5">
                        <input type="text" value="${d.desc || ''}" oninput="updateBulkCell(${idx}, 'desc', this.value)" 
                            placeholder="Work Description..." class="w-full bg-transparent px-2.5 py-1 text-white/80 rounded border border-transparent hover:border-white/10 focus:border-sky-500 focus:bg-black/40 outline-none text-xs">
                    </td>
                    <td class="p-2 text-center">
                        <button type="button" onclick="removeBulkItem(${idx})" class="p-1 text-white/20 hover:text-red-400 rounded transition opacity-0 group-hover:opacity-100">
                            <i data-lucide="trash-2" size="14"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            if (countSpan) countSpan.innerText = `${bulkData.length} items staged`;
            lucide.createIcons();
        }

        // Ubah isi cell langsung secara realtime
        function updateBulkCell(idx, key, val) {
            if (bulkData[idx]) {
                bulkData[idx][key] = val;
            }
        }

        // Tambah 1 baris kosong manual
        function addBlankRow() {
            bulkData.push({ ac: '', order: '', desc: '' });
            renderBulkTable();
            // Auto fokus ke input baris terakhir
            setTimeout(() => {
                const inputs = document.querySelectorAll('#bulk-table-body tr:last-child input');
                if (inputs.length > 0) inputs[0].focus();
            }, 50);
        }

        function removeBulkItem(idx) {
            bulkData.splice(idx, 1);
            renderBulkTable();
        }

        function clearBulkTable() {
            bulkData = [];
            renderBulkTable();
        }
        
        function handleTablePaste(e) {
            e.preventDefault();
            const raw = (e.clipboardData || window.clipboardData).getData('text');
            const rows = raw.split(/\r\n|\n/).filter(r => r.trim() !== "");
            
            const newItems = rows.map(r => {
                const cols = r.split('\t');
                return { 
                    ac: (cols[0] || '').trim(), 
                    order: (cols[1] || '').trim(), 
                    desc: (cols[2] || '').trim() 
                };
            }).filter(item => item.ac || item.order || item.desc);

            if (newItems.length === 0) return;

            bulkData = [...bulkData, ...newItems];
            renderBulkTable();

            Swal.fire({
                icon: 'success',
                title: `${newItems.length} Baris Dimasukkan ke Tabel`,
                toast: true,
                position: 'top-end',
                timer: 1500,
                showConfirmButton: false,
                background: '#151921',
                color: '#fff'
            });
        }
        
        function editOrder(orderNo) {
            const sMap = SUPABASE_UNITS[activeUnit];
            let item;
            if (sMap) {
                const raw = supabaseData.find(d => String(d.order) === String(orderNo));
                if (!raw) return;
                
                // Tentukan key remark dinamis
                const rKey = (activeUnit === 'TCP-9') ? 'remark' :
                             (activeUnit === 'TCR-2') ? 'remark_cs1' : 
                             (activeUnit === 'TCR-5') ? 'remark_mw' : 
                             (activeUnit === 'TCR-3') ? 'remark_sm4' : 'remark_sm1';
        
                item = { 
                    UnitCode: activeUnit, 
                    OrderNo: raw.order, 
                    ACReg: raw.ac_reg, 
                    Description: raw.description, 
                    Status: formatStatus(raw[sMap.colStatus]),
                    Remark: raw[rKey] || '' // Ambil remark dari database
                };
            } else {
                item = rawOpData.find(d => String(d.OrderNo) === String(orderNo));
            }
            
            if(!item) return;
            openModal('edit');
            populateAssignedNode('edit', item.UnitCode); // 👈 Tambahkan ini agar saat edit tetap
            document.getElementById('s-ac').value = item.ACReg;
            document.getElementById('s-order').value = item.OrderNo;
            document.getElementById('s-desc').value = item.Description;
            document.getElementById('s-status').value = item.Status;
            // ✅ BACA DARI Remark ATAU Remarks
            document.getElementById('s-remark').value = item.Remark || item.Remarks || '';
        }

        function toggleReported() {
            showOnlyReported = !showOnlyReported;
            currentPage = 1; // Reset ke halaman 1 saat filter diubah
            renderCards();
        }
        
        function updateSearch(val) {
            searchQuery = val;
            currentPage = 1; // Reset ke halaman 1 saat search
            renderCards();
        }

        // 🚀 MENU AKSI 3 TITIK (PERFORM JOB, EDIT, DELETE)
        async function openRowActionMenu(orderNo) {
            const { value: action } = await Swal.fire({
                title: `<span style="font-size:15px; color:#fff;">Order Action &bull; ${orderNo}</span>`,
                html: `
                    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 11px; text-align: left; padding: 4px;">
                        <button id="btn-act-perform" type="button" class="w-full py-3 px-4 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold flex items-center justify-between transition">
                            <span class="flex items-center gap-2"><i data-lucide="play-circle" style="width:16px; height:16px;"></i> Perform this Job</span>
                            <span style="font-size:9px; opacity:0.8;">TRACK TIME</span>
                        </button>
                        <button id="btn-act-edit" type="button" class="w-full py-2.5 px-4 rounded-xl bg-white/5 hover:bg-white/10 text-white font-semibold flex items-center gap-2 transition">
                            <i data-lucide="edit-3" style="width:15px; height:15px;"></i> Edit Order Details
                        </button>
                        <button id="btn-act-delete" type="button" class="w-full py-2.5 px-4 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold flex items-center gap-2 transition">
                            <i data-lucide="trash-2" style="width:15px; height:15px;"></i> Remove from Dashboard
                        </button>
                    </div>
                `,
                background: '#151921',
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'Dismiss',
                cancelButtonColor: '#334155',
                didOpen: () => {
                    lucide.createIcons();
                    document.getElementById('btn-act-perform').onclick = () => {
                        Swal.close();
                        openPerformJobModal(orderNo);
                    };
                    document.getElementById('btn-act-edit').onclick = () => {
                        Swal.close();
                        editOrder(orderNo);
                    };
                    document.getElementById('btn-act-delete').onclick = () => {
                        Swal.close();
                        deleteOrder(orderNo);
                    };
                }
            });
        }

        // 🚀 PEMANGGIL MODAL PERFORM JOB
        async function openPerformJobModal(orderNo) {
            const sMap = SUPABASE_UNITS[activeUnit];
            let itemData = null;

            if (sMap) {
                const raw = supabaseData.find(d => String(d.order) === String(orderNo));
                if (raw) {
                    itemData = {
                        orderNo: raw.order,
                        acReg: raw.ac_reg || '-',
                        description: raw.description || '-',
                        unitCode: activeUnit
                    };
                }
            } else {
                const raw = rawOpData.find(d => String(d.OrderNo) === String(orderNo));
                if (raw) {
                    itemData = {
                        orderNo: raw.OrderNo,
                        acReg: raw.ACReg || '-',
                        description: raw.Description || '-',
                        unitCode: activeUnit
                    };
                }
            }

            if (!itemData) {
                Swal.fire('Error', 'Detail order tidak ditemukan.', 'error');
                return;
            }

            // Simpan konteks order aktif ke global window
            window.activePerformJob = itemData;

            const placeholder = document.getElementById('performJobModalPlaceholder');
            if (!placeholder) return;
            placeholder.innerHTML = '';
            loader.style.display = 'flex';

            try {
                const res = await fetch('../../modal/performJob/index.html');
                if (!res.ok) throw new Error('File ../../modal/performJob/index.html tidak ditemukan.');
                const html = await res.text();
                placeholder.innerHTML = html;

                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    document.body.appendChild(newScript);
                });
                lucide.createIcons();
            } catch (err) {
                Swal.fire({ title: 'Gagal Memuat Modul', text: err.message, icon: 'error', background: '#151921', color: '#fff' });
            } finally {
                loader.style.display = 'none';
            }
        }

        init();
    </script>
</body>
</html>
