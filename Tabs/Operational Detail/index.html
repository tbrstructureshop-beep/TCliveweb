<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../api.js"></script>
    <style>
        :root { 
            --bg: #0b0e14; --panel: #151921; --border: rgba(255, 255, 255, 0.1); --accent: #0ea5e9; 
            --text-main: #94a3b8; --text-bold: #ffffff; --input-bg: rgba(255, 255, 255, 0.05);
        }
        .light {
            --bg: transparent; --panel: #ffffff; --border: #e2e8f0; --accent: #0284c7; 
            --text-main: #475569; --text-bold: #1e293b; --input-bg: #f8fafc;
        }
        body { background: transparent; color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; transition: all 0.3s ease; }
        .text-white, h1, h2, h3, h4 { color: var(--text-bold) !important; }
        
        .unit-nav { display: flex; gap: 0.5rem; padding: 0.5rem; background: rgba(0,0,0,0.2); border-radius: 1.25rem; border: 1px solid var(--border); overflow-x: auto; }
        .unit-nav::-webkit-scrollbar { display: none; }
        .unit-tab { padding: 0.75rem 1.5rem; border-radius: 1rem; font-size: 11px; font-weight: 800; white-space: nowrap; transition: 0.3s; color: var(--text-main); cursor: pointer; border: 1px solid transparent; }
        .unit-tab.active { background: var(--accent); color: white !important; box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4); border-color: rgba(255,255,255,0.2); }
        
        .op-card { background-color: var(--panel) !important; border: 1px solid var(--border) !important; border-radius: 2.5rem; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5); }
        
        .stat-box { flex: 1; min-width: 100px; padding: 12px; border-radius: 1.25rem; border: 1px solid var(--border); text-align: center; background: var(--input-bg); }
        .stat-val { display: block; font-size: 1.25rem; font-weight: 900; line-height: 1; margin-bottom: 4px; }
        .stat-lab { font-size: 8px; font-weight: 800; text-transform: uppercase; opacity: 0.5; letter-spacing: 1px; }

        .master-table { width: 100%; font-size: 11px; border-spacing: 0 8px; border-collapse: separate; }
        .master-table th { padding: 12px; text-align: left; opacity: 0.4; text-transform: uppercase; font-size: 10px; }
        .master-table td { padding: 14px 12px; background: rgba(255,255,255,0.01); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .master-table td:first-child { border-left: 1px solid var(--border); border-top-left-radius: 16px; border-bottom-left-radius: 16px; }
        .master-table td:last-child { border-right: 1px solid var(--border); border-top-right-radius: 16px; border-bottom-right-radius: 16px; }

        .input-field { background: var(--input-bg) !important; border: 1px solid var(--border) !important; color: var(--text-bold) !important; border-radius: 0.75rem; padding: 0.6rem; outline: none; font-size: 0.75rem; }
        
        #local-loader { display: none; position: fixed; inset: 0; background: rgba(11, 14, 20, 0.95); backdrop-filter: blur(10px); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .page-btn { padding: 0.6rem 1.2rem; border-radius: 0.75rem; background: var(--input-bg); border: 1px solid var(--border); font-size: 11px; font-weight: bold; transition: 0.2s; color: var(--text-bold); }
        .page-btn:hover:not(:disabled) { background: var(--accent); color: white; }
        .page-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="local-loader">
        <div class="w-12 h-12 border-4 border-sky-500/10 border-t-sky-500 rounded-full animate-spin mb-3"></div>
        <span class="text-[10px] font-mono text-sky-500 font-bold uppercase tracking-widest">Live_Database_Link...</span>
    </div>

    <!-- HEADER -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
            <h1 class="text-2xl font-black text-white uppercase tracking-tighter">Operational Detail</h1>
            <p class="text-[10px] opacity-40 font-mono uppercase tracking-widest">Hybrid Fleet Command (Supabase Live + Sheet Engine)</p>
        </div>
        <div class="flex gap-3">
            <button onclick="init()" class="bg-white/5 border border-white/10 hover:bg-white/10 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase transition-all flex items-center gap-2">
                <i data-lucide="refresh-cw" size="14"></i> Sync All
            </button>
            <button onclick="openModal('bulk')" class="bg-white/5 border border-white/10 hover:bg-white/10 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase transition-all">
                <i data-lucide="layout-grid" class="inline-block mr-1" size="14"></i> Bulk Table
            </button>
            <button onclick="openModal('single')" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2.5 rounded-xl font-bold text-[10px] uppercase transition-all">
                <i data-lucide="plus" class="inline-block mr-1" size="14"></i> Add Single
            </button>
        </div>
    </div>

    <!-- TAB NAV -->
    <div class="unit-nav-wrapper mb-8">
        <div id="unit-tabs" class="unit-nav"></div>
    </div>

    <div id="op-container"></div>

    <!-- MODAL -->
    <div id="op-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden flex items-center justify-center z-[110] p-4">
        <div class="bg-[#151921] border border-white/10 rounded-[3rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 border-b border-white/5 flex justify-between items-center text-white">
                <h3 id="modal-title" class="text-lg font-bold uppercase tracking-widest">Data Forge</h3>
                <button onclick="closeModal()" class="opacity-30 hover:opacity-100"><i data-lucide="x"></i></button>
            </div>
            <div class="p-8 space-y-4">
                <div><label class="text-[10px] font-bold uppercase mb-2 block">Assigned Node</label><select id="UnitCode" class="input-field w-full"></select></div>
                <div id="bulk-container" class="hidden">
                    <textarea id="paste-buffer" onpaste="handlePaste(event)" class="w-full h-40 bg-white/5 border border-white/10 rounded-xl p-4 text-xs text-white outline-none focus:border-sky-500" placeholder="AC REG [TAB] ORDER [TAB] DESC"></textarea>
                </div>
                <div id="single-container" class="grid grid-cols-2 gap-4">
                    <input type="hidden" id="primaryId">
                    <div><label class="text-[10px] font-bold uppercase mb-1 block">AC Registration</label><input id="s-ac" class="input-field w-full"></div>
                    <div><label class="text-[10px] font-bold uppercase mb-1 block">Order Number</label><input id="s-order" class="input-field w-full"></div>
                    <div class="col-span-2"><label class="text-[10px] font-bold uppercase mb-1 block">Work Description</label><input id="s-desc" class="input-field w-full"></div>
                    <div class="col-span-2"><label class="text-[10px] font-bold uppercase mb-1 block">Status</label>
                        <select id="s-status" class="input-field w-full">
                            <option>Top Urgent</option><option>Highlighted</option><option>Open</option><option>Progress</option><option>Closed</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="text-[10px] font-bold uppercase mb-1 block">Remark Editor</label>
                        <input id="s-remark" class="input-field w-full" placeholder="Enter custom remark...">
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-white/5">
                <button onclick="submitData()" class="w-full bg-sky-600 py-4 rounded-2xl font-black text-white text-[11px] uppercase tracking-widest">Authorize Data Entry</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const loader = document.getElementById('local-loader');
        const TAB_NAME = 'Operational Detail';
        
        let currentPage = 1, rowsPerPage = 10;
        let rawOpData = [], supabaseData = [], unitList = [], activeUnit = null, currentMode = 'single', bulkData = [];
        let showOnlyReported = true; // Default true
        let searchQuery = '';

        const PRIORITY = { 'Top Urgent': 0, 'Highlighted': 1, 'Open': 2, 'Progress': 3, 'Closed': 4 };

        const S_URL = 'https://tskcxblanrtvzlctpcyd.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRza2N4YmxhbnJ0dnpsY3RwY3lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwNjI0MjAsImV4cCI6MjA4MjYzODQyMH0.6epAPJdzgxe-pmG-rVtosdbg-dwF5lND6Xd18VgUeU0';
        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        // MAP SESUAI FILE W301, W302, W303
        const SUPABASE_UNITS = {
            'TCR-1': { colStatus: 'status_sm1', colDate: 'date_closed_sm1', filterCek: 'cek_sm1' },
            'TCR-2': { colStatus: 'status_cs1', colDate: 'date_closed_cs1', filterCek: 'cek_cs1' },
            'TCR-5': { colStatus: 'status_mw',  colDate: 'date_closed_mw',  filterCek: 'cek_mw' },
            'TCR-3': { colStatus: 'status_sm4', colDate: 'date_closed_sm4', filterCek: 'cek_sm4' },
            'TCR-4': { colStatus: 'status_cs4', colDate: 'date_closed_cs4', filterCek: 'cek_cs4' } // Tambahkan ini
        };
        
        async function init() {
            loader.style.display = 'flex';
            try {
                const [unitRes, opRes, { data: sData, error: sErr }] = await Promise.all([
                    API.get('UNIT'),
                    API.get(TAB_NAME),
                    supabaseClient.from('mntp_tcr').select('*').eq('archived', false) // <-- 'mdr_tracking' diubah ke 'mntp_tcr'
                ]);

                if (sErr) throw sErr;
                unitList = unitRes.data || [];
                rawOpData = opRes.data || [];
                supabaseData = sData || [];

                document.getElementById('UnitCode').innerHTML = unitList.map(u => `<option value="${u.UnitCode}">${u.UnitCode}</option>`).join('');
                if(!activeUnit && unitList.length > 0) activeUnit = unitList[0].UnitCode;
                
                renderTabs();
                renderCards();
            } catch (e) { Swal.fire('Sync Error', e.message, 'error'); } 
            finally { loader.style.display = 'none'; }
        }

        function renderTabs() {
            document.getElementById('unit-tabs').innerHTML = unitList.map(u => 
                `<button onclick="switchUnit('${u.UnitCode}')" class="unit-tab ${u.UnitCode === activeUnit ? 'active' : ''}">
                    ${u.UnitCode}
                </button>`).join('');
        }

        function renderCards() {
            const container = document.getElementById('op-container');
            let fullData = [];
            const sMap = SUPABASE_UNITS[activeUnit];

            // Di dalam renderCards(), ganti logika fullData menjadi:
            if (sMap) {
                let reportKey = 'report_sm1';
                let remarkKey = 'remark_sm1';
            
                if (activeUnit === 'TCR-2') {
                    reportKey = 'report_cs1';
                    remarkKey = 'remark_cs1';
                } else if (activeUnit === 'TCR-5') {
                    reportKey = 'report_mw';
                    remarkKey = 'remark_mw';
                } else if (activeUnit === 'TCR-3') {
                    reportKey = 'report_sm4';
                    remarkKey = 'remark_sm4';
                } else if (activeUnit === 'TCR-4') { // Tambahkan ini
                    reportKey = 'report_cs4';
                    remarkKey = 'remark_cs4';
                }  
                fullData = supabaseData
                    .filter(item => {
                        const isReported = (item[reportKey] === true || item[reportKey] === '1' || item[reportKey] === 'checked');
                        const matchReport = showOnlyReported ? isReported : true;
                        
                        const matchSearch = (
                            (item.ac_reg || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (String(item.order) || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                            (item.description || '').toLowerCase().includes(searchQuery.toLowerCase())
                        );
            
                        return item[sMap.filterCek] === 'red' && matchReport && matchSearch;
                    })
                    .map(item => ({
                        ACReg: item.ac_reg || '-',
                        OrderNo: item.order ? String(item.order) : '-', 
                        Description: item.description || '-',
                        Status: formatStatus(item[sMap.colStatus]),
                        Remark: item[remarkKey] || '-',
                        UnitCode: activeUnit,
                        isLive: true
                    }));
            }

            fullData.sort((a, b) => PRIORITY[a.Status] - PRIORITY[b.Status]);

            // Summary Stats Lengkap
            const stats = {
                total: fullData.length,
                urgent: fullData.filter(i => i.Status === 'Top Urgent').length,
                high: fullData.filter(i => i.Status === 'Highlighted').length,
                open: fullData.filter(i => i.Status === 'Open').length,
                prog: fullData.filter(i => i.Status === 'Progress').length,
                done: fullData.filter(i => i.Status === 'Closed').length
            };

            // Pagination Logic
            const limit = rowsPerPage === 'All' ? stats.total : parseInt(rowsPerPage);
            const totalPages = Math.ceil(stats.total / limit) || 1;
            if (currentPage > totalPages) currentPage = 1;
            const start = (currentPage - 1) * limit;
            const paginatedItems = fullData.slice(start, start + limit);

            container.innerHTML = `
                <div class="op-card animate-in fade-in duration-500">
                    <div class="flex flex-col xl:flex-row justify-between items-start gap-6 mb-10">
                        <!-- Bagian Kiri: Judul -->
                        <div>
                            <span class="text-[10px] font-bold uppercase text-sky-500 tracking-[0.2em] mb-1 block">
                                ${sMap ? 'Live Database (Syncing with Workshop)' : 'Cloud Spreadsheet Storage'}
                            </span>
                            <h2 class="text-4xl font-black text-white tracking-tighter uppercase">${activeUnit}</h2>
                            
                            <!-- SEARCH & TOGGLE DITEMPATKAN DI SINI -->
                            <div class="flex flex-col md:flex-row gap-2 mt-4">
                                <input type="text" id="search-input" placeholder="Search AC, Order, or Desc..." 
                                    value="${searchQuery}" oninput="updateSearch(this.value)" 
                                    class="input-field w-full md:w-64">
                                
                                <button onclick="toggleReported()" class="px-4 py-2 rounded-xl text-[10px] font-bold border transition-all ${showOnlyReported ? 'bg-sky-600 border-sky-500 text-white' : 'bg-white/5 border-white/10 text-white'}">
                                    ${showOnlyReported ? 'REPORTED ONLY' : 'SHOW ALL'}
                                </button>
                            </div>
                        </div>
                        
                        <!-- Stats Grid Lengkap -->
                        <div class="grid grid-cols-3 md:grid-cols-6 gap-2 flex-1 w-full max-w-4xl">
                            <div class="stat-box"><span class="stat-val">${stats.total}</span><span class="stat-lab">Total</span></div>
                            <div class="stat-box border-red-500/30 text-red-500"><span class="stat-val">${stats.urgent}</span><span class="stat-lab">Urgent</span></div>
                            <div class="stat-box border-purple-500/20 text-purple-400"><span class="stat-val">${stats.high}</span><span class="stat-lab">High</span></div>
                            <div class="stat-box border-blue-500/20 text-blue-400"><span class="stat-val">${stats.open}</span><span class="stat-lab">Open</span></div>
                            <div class="stat-box border-yellow-500/20 text-yellow-400"><span class="stat-val">${stats.prog}</span><span class="stat-lab">Prog</span></div>
                            <div class="stat-box border-emerald-500/20 text-emerald-400"><span class="stat-val">${stats.done}</span><span class="stat-lab">Done</span></div>
                        </div>
                    </div>

                    <!-- Pagination Controls -->
                    <div class="flex flex-wrap justify-between items-center gap-4 py-4 border-t border-white/5 mb-4">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-bold uppercase opacity-30">Rows per page</span>
                            <select onchange="updateRowsPerPage(this.value)" class="input-field py-1">
                                <option value="10" ${rowsPerPage == 10 ? 'selected' : ''}>10</option>
                                <option value="25" ${rowsPerPage == 25 ? 'selected' : ''}>25</option>
                                <option value="50" ${rowsPerPage == 50 ? 'selected' : ''}>50</option>
                                <option value="All" ${rowsPerPage == 'All' ? 'selected' : ''}>All</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-4">
                            <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''} class="page-btn"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                            <span class="text-[10px] font-bold uppercase tracking-widest">Page ${currentPage} <span class="opacity-20">/</span> ${totalPages}</span>
                            <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''} class="page-btn"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="master-table">
                            <thead><tr><th>AC Reg</th><th>Order No</th><th>Description</th><th class="w-32">Live Status</th><th>Remark</th><th class="text-right">Action</th></tr></thead>
                                ${paginatedItems.map(item => `
                                    <tr class="group hover:bg-white/[0.02] transition-all">
                                        <td class="font-black text-white uppercase">${item.ACReg}</td>
                                        <td class="font-mono text-sky-400">${item.OrderNo}</td>
                                        <td class="text-white/60 leading-tight pr-4">${item.Description}</td>
                                        <td>
                                            <select 
                                                onchange="handleUpdateStatus('${activeUnit}', '${item.OrderNo}', this.value)" 
                                                class="px-2 py-1 rounded-full border text-[10px] font-bold outline-none cursor-pointer ${getStatusBadgeClass(item.Status)}"
                                            >
                                                ${['Top Urgent', 'Highlighted', 'Open', 'Progress', 'Closed'].map(s => 
                                                    `<option value="${s}" ${item.Status === s ? 'selected' : ''}>${s}</option>`
                                                ).join('')}
                                            </select>
                                        </td>
                                        <td class="text-white/60">${item.Remark}</td>
                                        <td class="text-right">
                                            <div class="flex gap-4 justify-end opacity-0 group-hover:opacity-100 transition-all">
                                                <button onclick="editOrder('${item.OrderNo}')" class="text-sky-500/50 hover:text-sky-400"><i data-lucide="edit-3" size="14"></i></button>
                                                <button onclick="deleteOrder('${item.OrderNo}')" class="text-red-500/30 hover:text-red-500"><i data-lucide="trash-2" size="14"></i></button>
                                            </div>
                                        </td>
                                    </tr>`).join('')}
                                ${paginatedItems.length === 0 ? '<tr><td colspan="5" class="text-center py-20 opacity-20 italic tracking-widest font-mono">NODE_EMPTY // NO_ACTIVE_TASKS</td></tr>' : ''}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            lucide.createIcons();
        }

        async function handleUpdateStatus(uCode, oNo, status) {
            loader.style.display = 'flex';
            const sMap = SUPABASE_UNITS[uCode];
            try {
                if (sMap) {
                    const payload = {};
                    // Gunakan pemetaan key berdasarkan unit
                    const statusKey = (uCode === 'TCR-4') ? 'status_cs4' : 
                                      (uCode === 'TCR-3') ? 'status_sm4' : 
                                      (uCode === 'TCR-5') ? 'status_mw' : 
                                      (uCode === 'TCR-2') ? 'status_cs1' : 'status_sm1';
                                      
                    const dateKey = (uCode === 'TCR-4') ? 'date_closed_cs4' : 
                                    (uCode === 'TCR-3') ? 'date_closed_sm4' : 
                                    (uCode === 'TCR-5') ? 'date_closed_mw' : 
                                    (uCode === 'TCR-2') ? 'date_closed_cs1' : 'date_closed_sm1';
                    
                    payload[statusKey] = status.toUpperCase();
                    
                    if (status.toUpperCase() === 'CLOSED') {
                        const now = new Date();
                        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                        payload[dateKey] = `${now.getDate().toString().padStart(2,'0')}-${months[now.getMonth()]}-${now.getFullYear()}`;
                    } else {
                        payload[dateKey] = null;
                    }
        
                    const targetRow = supabaseData.find(d => String(d.order) === String(oNo));
                    if (!targetRow || !targetRow.id) throw new Error("Row ID not found for order: " + oNo);
        
                    const { error } = await supabaseClient.from('mntp_tcr').update(payload).eq('id', targetRow.id);
                    if (error) throw error;
                } else {
                    await API.post({ tab: TAB_NAME, action: 'update', primaryId: oNo, Status: status });
                }
                await init();
            } catch (e) { 
                loader.style.display = 'none'; 
                Swal.fire('Update Error', e.message, 'error');
            }
        }

        async function deleteOrder(orderNo) {
            const sMap = SUPABASE_UNITS[activeUnit];
            const res = await Swal.fire({ 
                title: 'Purge Item?', 
                text: sMap ? 'Remove assigned tag? (This item will return to unassigned list)' : 'Delete from storage?',
                icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', background: '#151921', color: '#fff' 
            });
            if(res.isConfirmed) {
                loader.style.display = 'flex';
                try {
                    if (sMap) {
                        const payload = {}; 
                        payload[sMap.filterCek] = ''; // Mengosongkan filter cek_sm1 di Supabase
                        
                        const targetRow = supabaseData.find(d => String(d.order) === String(orderNo));
                        if (!targetRow || !targetRow.id) throw new Error("Row ID not found for order: " + orderNo);

                        const { error } = await supabaseClient.from('mntp_tcr').update(payload).eq('id', targetRow.id);
                        if (error) throw error;
                    } else {
                        const apiRes = await API.post({ tab: TAB_NAME, action: 'delete', primaryId: orderNo });
                        if (apiRes && apiRes.status !== 'success') throw new Error(apiRes.message);
                    }
                    await init();
                } catch (e) { 
                    loader.style.display = 'none';
                    Swal.fire({ title: 'Error', text: e.message, icon: 'error', background: '#151921', color: '#fff' });
                }
            }
        }

        async function submitData() {
            loader.style.display = 'flex';
            const unit = document.getElementById('UnitCode').value;
            const sMap = SUPABASE_UNITS[unit];
            const orderNo = document.getElementById('s-order').value;
            const status = document.getElementById('s-status').value;
            const remark = document.getElementById('s-remark').value; // Ambil nilai remark
            
            try {
                if (sMap && (currentMode === 'edit' || currentMode === 'single')) {
                    const payload = {}; 
                    payload[sMap.colStatus] = status.toUpperCase();
                    
                    // Tentukan key remark dinamis
                    const rKey = (unit === 'TCR-2') ? 'remark_cs1' : 
                                 (unit === 'TCR-5') ? 'remark_mw' : 
                                 (unit === 'TCR-3') ? 'remark_sm4' : 'remark_sm1';
                    
                    payload[rKey] = remark; // Simpan remark
                    
                    const targetRow = supabaseData.find(d => String(d.order) === String(orderNo));
                    if (!targetRow || !targetRow.id) throw new Error("Row ID not found for order: " + orderNo);
        
                    const { error } = await supabaseClient.from('mntp_tcr').update(payload).eq('id', targetRow.id);
                    if (error) throw error;
                } else if (currentMode === 'bulk') {
                    for(let d of bulkData) {
                        await API.post({ tab: TAB_NAME, action: 'add', UnitCode: unit, ACReg: d.ac, OrderNo: d.order, Description: d.desc, Status: 'Open', primaryId: d.order });
                    }
                } else {
                    const action = (currentMode === 'edit' ? 'update' : 'add');
                    await API.post({ 
                        tab: TAB_NAME, 
                        action: action, 
                        UnitCode: unit, 
                        ACReg: document.getElementById('s-ac').value, 
                        OrderNo: orderNo, 
                        Description: document.getElementById('s-desc').value, 
                        Status: status, 
                        primaryId: orderNo 
                    });
                }
                closeModal(); 
                await init();
                Swal.fire({ icon: 'success', title: 'Authorization Success', timer: 1000, showConfirmButton: false, background: '#151921', color: '#fff' });
            } catch (e) { 
                loader.style.display = 'none'; 
                Swal.fire('Error', e.message, 'error');
            }
        }

        function switchUnit(uCode) { activeUnit = uCode; currentPage = 1; renderTabs(); renderCards(); }
        function updateRowsPerPage(val) { rowsPerPage = val; currentPage = 1; renderCards(); }
        function changePage(dir) { currentPage += dir; renderCards(); }
        function formatStatus(s) { if (!s) return 'Open'; return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

        function getStatusBadgeClass(status) {
            const statusMap = {
                'Top Urgent': 'bg-red-500/20 text-red-500 border-red-500/50',
                'Highlighted': 'bg-purple-500/20 text-purple-400 border-purple-500/50',
                'Open': 'bg-blue-500/20 text-blue-400 border-blue-500/50',
                'Progress': 'bg-yellow-500/20 text-yellow-400 border-yellow-500/50',
                'Closed': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50'
            };
            return statusMap[status] || 'bg-gray-500/20 text-gray-400 border-gray-500/50';
        }
        
        function openModal(mode) {
            currentMode = mode; 
            document.getElementById('op-modal').classList.remove('hidden');
            document.getElementById('bulk-container').classList.toggle('hidden', mode !== 'bulk');
            document.getElementById('single-container').classList.toggle('hidden', mode === 'bulk');
            document.getElementById('s-order').disabled = (mode === 'edit');
        }
        function closeModal() { document.getElementById('op-modal').classList.add('hidden'); bulkData = []; }
        function handlePaste(e) {
            const raw = (e.clipboardData || window.clipboardData).getData('text');
            const rows = raw.split(/\r\n|\n/).filter(r => r.trim() !== "");
            bulkData = rows.map(r => { const cols = r.split('\t'); return { ac: cols[0] || '', order: cols[1] || '', desc: cols[2] || '' }; });
            Swal.fire('Buffer Full', `${bulkData.length} entries parsed`, 'info');
        }
        
        function editOrder(orderNo) {
            const sMap = SUPABASE_UNITS[activeUnit];
            let item;
            if (sMap) {
                const raw = supabaseData.find(d => String(d.order) === String(orderNo));
                if (!raw) return;
                
                // Tentukan key remark dinamis
                const rKey = (activeUnit === 'TCR-2') ? 'remark_cs1' : 
                             (activeUnit === 'TCR-5') ? 'remark_mw' : 
                             (activeUnit === 'TCR-3') ? 'remark_sm4' : 'remark_sm1';
        
                item = { 
                    UnitCode: activeUnit, 
                    OrderNo: raw.order, 
                    ACReg: raw.ac_reg, 
                    Description: raw.description, 
                    Status: formatStatus(raw[sMap.colStatus]),
                    Remark: raw[rKey] || '' // Ambil remark dari database
                };
            } else {
                item = rawOpData.find(d => String(d.OrderNo) === String(orderNo));
            }
            
            if(!item) return;
            openModal('edit');
            document.getElementById('UnitCode').value = item.UnitCode;
            document.getElementById('s-ac').value = item.ACReg;
            document.getElementById('s-order').value = item.OrderNo;
            document.getElementById('s-desc').value = item.Description;
            document.getElementById('s-status').value = item.Status;
            document.getElementById('s-remark').value = item.Remark; // Isi input remark
        }

        function toggleReported() {
            showOnlyReported = !showOnlyReported;
            currentPage = 1; // Reset ke halaman 1 saat filter diubah
            renderCards();
        }
        
        function updateSearch(val) {
            searchQuery = val;
            currentPage = 1; // Reset ke halaman 1 saat search
            renderCards();
        }

        init();
    </script>
</body>
</html>
