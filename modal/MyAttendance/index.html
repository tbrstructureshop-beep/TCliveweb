<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #151921; --panel: #1c222c; --border: rgba(255, 255, 255, 0.05); --accent: #0ea5e9; --text-main: #94a3b8; --text-bold: #ffffff; }
        body { background: transparent; color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; overflow-y: auto; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 1.5rem; overflow: hidden; }
        .input-field { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 0.75rem; padding: 0.75rem 1rem; color: white; outline: none; font-size: 0.875rem; }
        .btn-primary { background: var(--accent); color: white; font-weight: 700; text-transform: uppercase; padding: 0.8rem; border-radius: 0.75rem; transition: all 0.2s; }
        .btn-primary:disabled { opacity: 0.1; cursor: not-allowed; filter: grayscale(1); }
        
        #local-loader { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #btn-f1 span, #btn-f4 span { color: var(--text-bold) !important; }
        .history-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); transition: all 0.3s; }
        
        .tab-btn { flex: 1; padding: 0.5rem; text-align: center; font-size: 10px; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 0.75rem; transition: all 0.2s; color: var(--text-main); }
        .tab-btn.active { background: var(--accent); color: white; }

        /* 🚀 INDIKATOR NONAKTIF: GRAYED-OUT & OPACITY REDUP OTOMATIS */
        #office-actions button:disabled {
            opacity: 0.25 !important;
            cursor: not-allowed !important;
            filter: grayscale(1) !important;
            pointer-events: none !important;
            border-color: transparent !important;
            box-shadow: none !important;
        }
        #office-actions button:not(:disabled):hover {
            transform: translateY(-2px);
        }

        /* Accordion CSS */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }

        /* CUSTOM SCROLLBAR THEME */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        
        select option { background-color: #1c222c; color: #fff; }
    </style>
</head>
<body class="p-4 bg-[#151921] min-h-screen">

    <div id="local-loader">
        <div class="w-8 h-8 border-4 border-sky-500/20 border-t-sky-500 rounded-full animate-spin mb-4"></div>
        <p class="text-[10px] font-mono uppercase tracking-widest text-sky-500">Node_Syncing...</p>
    </div>

    <!-- HEADER -->
    <div class="max-w-md mx-auto mb-4 flex justify-between items-center">
        <button onclick="window.parent.closeAttendanceModal()" class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-widest text-sky-500 hover:text-white transition">
            <i data-lucide="arrow-left" class="w-3 h-3"></i> Back
        </button>
        <div class="flex items-center gap-2">
            <div id="ip-status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
            <span id="ip-label" class="text-[9px] font-mono opacity-50 uppercase">Network_Check...</span>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="main-interface" class="max-w-md mx-auto space-y-4">
        <div class="glass-panel p-6 flex flex-col items-center text-center">
            <p id="display-date" class="text-[10px] font-mono text-sky-500 uppercase mb-1"></p>
            <h1 id="display-clock" class="text-4xl font-bold text-white font-mono tracking-widest mb-4">00:00:00</h1>
            <!-- 🚀 1 SET RIWAYAT HARI INI (PENANDA SISTEM SEHAT) -->
            <div id="today-punch-ribbon" class="w-full py-2.5 px-4 rounded-xl bg-black/40 border border-white/5 flex items-center justify-between text-[10px] font-mono mb-2">
                <div class="flex items-center gap-1.5">
                    <span class="text-white/40 uppercase">F1 (In):</span>
                    <b id="ribbon-f1" class="text-white/30">--:--</b>
                </div>
                <div class="w-px h-3 bg-white/10"></div>
                <div class="flex items-center gap-1.5">
                    <span class="text-white/40 uppercase">F4 (Out):</span>
                    <b id="ribbon-f4" class="text-white/30">--:--</b>
                </div>
                <div class="w-px h-3 bg-white/10"></div>
                <div class="flex items-center gap-1.5">
                    <div id="ribbon-dot" class="w-1.5 h-1.5 rounded-full bg-slate-500"></div>
                    <span id="ribbon-status" class="text-[9px] uppercase font-bold text-white/40">Ready</span>
                </div>
            </div>
            <div class="w-full pt-4 border-t border-white/5 flex items-center justify-between">
                <div class="text-left">
                    <p id="user-name" class="text-white font-bold text-sm"></p>
                    <p id="user-job" class="text-[10px] text-sky-400 font-semibold uppercase tracking-wider"></p>
                </div>
            </div>
        </div>

        <!-- CLOCK IN / OUT ACTIONS -->
        <div id="office-actions" class="grid grid-cols-2 gap-4">
            <button id="btn-f1" onclick="recordAttendance('F1')" class="glass-panel p-6 flex flex-col items-center gap-3 hover:border-sky-500 transition-all group">
                <div class="p-3 rounded-2xl bg-sky-500/10 text-sky-500 group-hover:bg-sky-500 group-hover:text-white"><i data-lucide="play" size="24"></i></div>
                <span class="text-[10px] font-bold uppercase">Clock In</span>
            </button>
            <button id="btn-f4" onclick="recordAttendance('F4')" class="glass-panel p-6 flex flex-col items-center gap-3 hover:border-red-500 transition-all group">
                <div class="p-3 rounded-2xl bg-red-500/10 text-red-500 group-hover:bg-red-500 group-hover:text-white"><i data-lucide="square" size="24"></i></div>
                <span class="text-[10px] font-bold uppercase">Clock Out</span>
            </button>
        </div>

        <!-- LEAVE & PERMIT PROPOSAL PANEL -->
        <div id="remote-actions" class="glass-panel p-6 space-y-3">
            <div class="flex items-center gap-2 text-amber-500 font-bold text-[10px] uppercase">
                <i data-lucide="calendar-range" size="14"></i> Leave & Permit Proposal
            </div>
            
            <select id="leaveType" class="input-field text-xs">
                <option value="" disabled selected>-- SELECT LEAVE TYPE --</option>
                <option value="Sick Leave">Sick Leave</option>
                <option value="Annual Leave">Annual Leave</option>
                <option value="Training">Training</option>
                <option value="Business Trip">Business Trip</option>
                <option value="Special Leave">Special Leave</option>
                <option value="Marriage Leave">Marriage Leave</option>
                <option value="Child Marriage">Child Marriage</option>
                <option value="Child Circumcision">Child Circumcision</option>
                <option value="Child Baptism">Child Baptism</option>
                <option value="Child tooth Cut">Child tooth Cut</option>
                <option value="Wife Child Birth">Wife Child Birth</option>
                <option value="Miscarriage">Miscarriage</option>
                <option value="Spouse/Parent Death">Spouse/Parent Death</option>
                <option value="Family in One Household Passed Away">Family in One Household Passed Away</option>
                <option value="Child/Spouse Hospitalized">Child/Spouse Hospitalized</option>
                <option value="Hajj Leave">Hajj Leave</option>
                <option value="Umrah Leave">Umrah Leave</option>
                <option value="Pilgrimage Leave">Pilgrimage Leave</option>
                <option value="Baby Birth">Baby Birth</option>
                <option value="Premature Baby Birth">Premature Baby Birth</option>
                <option value="Emergency Leave">Emergency Leave</option>
                <option value="Masa Persiapan Pensiun">Masa Persiapan Pensiun</option>
                <option value="Got Call from Police/Court/Gov">Got Call from Police/Court/Gov</option>
            </select>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <span class="text-[9px] uppercase opacity-60 block mb-1 font-bold">Start Date</span>
                    <input type="date" id="startDate" class="input-field text-xs font-mono">
                </div>
                <div>
                    <span class="text-[9px] uppercase opacity-60 block mb-1 font-bold">Until Date</span>
                    <input type="date" id="untilDate" class="input-field text-xs font-mono">
                </div>
            </div>

            <button onclick="recordLeave()" class="btn-primary w-full text-[10px] py-3 mt-2">Submit Proposal</button>
        </div>

        <!-- ✅ ACCORDION HISTORY DENGAN PEMISAHAN TAB -->
        <details class="glass-panel group pb-4">
            <summary class="flex items-center justify-between p-4 cursor-pointer outline-none hover:bg-white/5 transition-colors">
                <span class="text-[10px] font-bold uppercase tracking-widest text-sky-500">Weekly History (This Week)</span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-sky-500 group-open:rotate-180 transition-transform"></i>
            </summary>
            
            <div class="px-4 space-y-3">
                <!-- Tab Switcher -->
                <div class="flex bg-black/30 p-1 rounded-xl border border-white/5">
                    <button id="tab-att" onclick="switchHistoryTab('attendance')" class="tab-btn active">Attendance</button>
                    <button id="tab-leave" onclick="switchHistoryTab('leave')" class="tab-btn">Leave / Permit</button>
                </div>
                
                <div id="history-container" class="space-y-2 mt-2"></div>
            </div>
        </details>
    </div>

    <script>
        lucide.createIcons();
        const loader = document.getElementById('local-loader');
        const ALLOWED_IPS = ["118.97.115.66", "118.97.70.226"]; 
        let currentUser = null;
        let isInsideOffice = false;
        let masterData = { attendance: [] };
        let activeHistoryTab = 'attendance'; // 'attendance' atau 'leave'

        function getFingerprint() { return `${navigator.userAgent}-${screen.width}x${screen.height}`; }

        // 🚀 SMART DEVICE VALIDATION: BISA RE-LINK OTOMATIS TANPA TERKUNCI MATI
        async function isDeviceValid() {
            const devKey = "DeviceId(phone)";
            const currentFp = getFingerprint();
            const registeredFp = (currentUser && currentUser[devKey]) ? currentUser[devKey].trim() : "";

            // Jika belum pernah ditautkan sama sekali, tautkan otomatis
            if (!registeredFp) {
                currentUser[devKey] = currentFp;
                localStorage.setItem('tc_user', JSON.stringify(currentUser));
                API.post({
                    tab: 'USER',
                    action: 'update',
                    primaryId: currentUser.EmployeeId,
                    [devKey]: currentFp
                }).catch(console.error);
                return true;
            }

            // Jika terdeteksi perbedaan sidik jari perangkat
            if (registeredFp !== currentFp) {
                const { isConfirmed } = await Swal.fire({
                    icon: 'warning',
                    title: 'Perangkat Berbeda Terdeteksi',
                    html: `
                        <div style="font-size:11px; color:#94a3b8; text-align:left; line-height:1.6;">
                            <p>Akun ini terdaftar dengan profil layar sebelumnya. Perubahan resolusi monitor, zoom, atau ganti browser dapat memicu proteksi ini.</p>
                            <p style="color:#fff; font-weight:bold; margin-top:8px;">Tautkan perangkat yang sedang Anda pakai ini sekarang?</p>
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Ya, Tautkan Perangkat Ini',
                    confirmButtonColor: '#0ea5e9',
                    cancelButtonText: 'Batal',
                    cancelButtonColor: '#334155',
                    background: '#151921',
                    color: '#fff'
                });

                if (isConfirmed) {
                    loader.style.display = 'flex';
                    try {
                        currentUser[devKey] = currentFp;
                        localStorage.setItem('tc_user', JSON.stringify(currentUser));
                        
                        // Perbarui Device ID di sheet USER
                        await API.post({
                            tab: 'USER',
                            action: 'update',
                            primaryId: currentUser.EmployeeId,
                            [devKey]: currentFp
                        });

                        Swal.fire({
                            icon: 'success',
                            title: 'Device Linked',
                            text: 'Perangkat ini berhasil ditautkan ke akun Anda.',
                            background: '#151921',
                            color: '#fff',
                            timer: 1500,
                            showConfirmButton: false
                        });
                        return true;
                    } catch(err) {
                        Swal.fire({ icon: 'error', title: 'Gagal', text: err.message, background: '#151921', color: '#fff' });
                        return false;
                    } finally {
                        loader.style.display = 'none';
                    }
                }
                return false;
            }
            return true;
        }
        
        // 🚀 PENGAMAN: Cegah error JSON jika jaringan membalas HTML <!DOCTYPE
        async function verifyNetwork() {
            try {
                const resp = await fetch('https://api.ipify.org?format=json');
                const rawText = await resp.text();
                
                // Jika balasan berawalan '<' (HTML / Captive portal), abaikan dan jangan di-JSON.parse
                if (rawText.trim().startsWith('<')) throw new Error("Blocked by network portal");
                
                const data = JSON.parse(rawText);
                isInsideOffice = ALLOWED_IPS.includes(data.ip);
                document.getElementById('ip-status-dot').className = `w-2 h-2 rounded-full ${isInsideOffice ? 'bg-green-500' : 'bg-amber-500 animate-pulse'}`;
                document.getElementById('ip-label').innerText = isInsideOffice ? 'OFFICE_NETWORK' : 'REMOTE_NETWORK';
            } catch (e) {
                // Fallback aman tanpa crash
                isInsideOffice = false;
                document.getElementById('ip-status-dot').className = 'w-2 h-2 rounded-full bg-slate-500';
                document.getElementById('ip-label').innerText = 'OFFLINE / REMOTE';
            }
        }

        async function init() {
            const saved = localStorage.getItem('tc_user');
            if (!saved) {
                document.body.innerHTML = '<div style="display:flex; height:100vh; align-items:center; justify-content:center; color:#0ea5e9; font-family:monospace; text-transform:uppercase; font-size:10px;">Authentication Required</div>';
                return;
            }
            currentUser = JSON.parse(saved);

            await verifyNetwork();

            try {
                // 🚀 HANCURKAN CACHE LOKAL: Agar sinkron jika kamu baru hapus data manual di sheet
                if (API.clearLocalCache) await API.clearLocalCache('ATTENDANCE_RECORD');
                try { if (window.parent && window.parent.clearCache) window.parent.clearCache('ATTENDANCE_RECORD'); } catch(e) {}
                await API._dbOp("delete", "ATTENDANCE_RECORD");

                // Ambil data paling segar langsung dari Google Sheet
                const [freshAtt, shiftRes] = await Promise.all([
                    API.get('ATTENDANCE_RECORD'),
                    API.get('SHIFTS')
                ]);
                masterData.attendance = freshAtt.data || [];
                masterData.shifts = shiftRes.data || []; //
                showMainInterface();
            } catch (e) { 
                console.error(e); 
            } finally { 
                loader.style.display = 'none'; 
            }
        }

        function isLeaveRecordCheck(r) {
            return r.Leave && String(r.Leave).trim() !== '' && String(r.Leave).trim() !== 'Present';
        }

        function showMainInterface() {
            document.getElementById('user-name').innerText = currentUser.Name;
            document.getElementById('user-job').innerText = currentUser.JobTitle;
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const attendanceList = masterData.attendance || [];

            const myRecords = attendanceList.filter(r => 
                String(r.EmployeeId).trim() === String(currentUser.EmployeeId).trim()
            );

            // 🚀 PERBAIKAN: Pastikan Leave "Pending" tidak dibaca sebagai sesi masuk yang gantung
            const unclosedSession = myRecords.find(r => 
                !isLeaveRecordCheck(r) &&
                r.F1 && String(r.F1).trim() !== '-' && String(r.F1).trim() !== '' && 
                (!r.F4 || String(r.F4).trim() === '' || String(r.F4).trim() === '-')
            );

            const btnF1 = document.getElementById('btn-f1');
            const btnF4 = document.getElementById('btn-f4');

            if (unclosedSession) {
                // Ada F1 yang belum di-F4: KUNCI F1 (Grayed-out), BUKA F4!
                btnF1.disabled = true;
                btnF4.disabled = false;
            } else {
                // Tidak ada sesi gantung: BUKA F1, KUNCI F4!
                btnF1.disabled = false;
                btnF4.disabled = true;
            }

            // 3. 🚀 UPDATE 1 SET RIWAYAT HARI INI DI BAWAH JAM
            const todayRecord = myRecords.find(r => r.Date === dateStr);
            const ribbonF1 = document.getElementById('ribbon-f1');
            const ribbonF4 = document.getElementById('ribbon-f4');
            const ribbonStatus = document.getElementById('ribbon-status');
            const ribbonDot = document.getElementById('ribbon-dot');

            if (todayRecord && todayRecord.F1 && todayRecord.F1 !== '-') {
                ribbonF1.innerText = todayRecord.F1;
                ribbonF1.className = "text-emerald-400 font-bold";

                if (todayRecord.F4 && todayRecord.F4 !== '-') {
                    ribbonF4.innerText = todayRecord.F4;
                    ribbonF4.className = "text-blue-400 font-bold";
                    ribbonStatus.innerText = "Completed";
                    ribbonStatus.className = "text-[9px] uppercase font-bold text-sky-400";
                    ribbonDot.className = "w-1.5 h-1.5 rounded-full bg-sky-500";
                } else {
                    ribbonF4.innerText = "--:--";
                    ribbonF4.className = "text-white/30";
                    ribbonStatus.innerText = "Active (In)";
                    ribbonStatus.className = "text-[9px] uppercase font-bold text-emerald-400";
                    ribbonDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse";
                }
            } else {
                ribbonF1.innerText = "--:--";
                ribbonF1.className = "text-white/30";
                ribbonF4.innerText = "--:--";
                ribbonF4.className = "text-white/30";
                ribbonStatus.innerText = "Ready";
                ribbonStatus.className = "text-[9px] uppercase font-bold text-white/40";
                ribbonDot.className = "w-1.5 h-1.5 rounded-full bg-slate-500";
            }

            renderHistory(dateStr);
            startClock();
        }

        function switchHistoryTab(tab) {
            activeHistoryTab = tab;
            document.getElementById('tab-att').className = `tab-btn ${tab === 'attendance' ? 'active' : ''}`;
            document.getElementById('tab-leave').className = `tab-btn ${tab === 'leave' ? 'active' : ''}`;
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            renderHistory(dateStr);
        }

        function renderHistory(todayStr) {
            const container = document.getElementById('history-container');
            const attendanceList = masterData.attendance || [];

            const userRecords = attendanceList
                .filter(r => String(r.EmployeeId).trim() === String(currentUser.EmployeeId).trim())
                .sort((a, b) => new Date(b.Date) - new Date(a.Date));

            const curr = new Date();
            let filteredRecords = [];

            if (activeHistoryTab === 'leave') {
                const firstDayOfMonth = new Date(curr.getFullYear(), curr.getMonth(), 1);
                firstDayOfMonth.setHours(0,0,0,0);
                const lastDayOfMonth = new Date(curr.getFullYear(), curr.getMonth() + 1, 0, 23, 59, 59);

                filteredRecords = userRecords.filter(r => {
                    const recordDate = new Date(r.Date);
                    return isLeaveRecordCheck(r) && recordDate >= firstDayOfMonth && recordDate <= lastDayOfMonth;
                });
            } else {
                const firstDayOfWeek = new Date(curr.setDate(curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1)));
                firstDayOfWeek.setHours(0,0,0,0);

                filteredRecords = userRecords.filter(r => {
                    const recordDate = new Date(r.Date);
                    return !isLeaveRecordCheck(r) && recordDate >= firstDayOfWeek;
                });
            }

            if (filteredRecords.length === 0) {
                container.innerHTML = `<div class="py-4 text-center text-[10px] opacity-20 uppercase">No ${activeHistoryTab} records found</div>`;
                return;
            }

            if (activeHistoryTab === 'leave') {
                let groupedLeaves = [];
                let tempGroup = [];

                filteredRecords.sort((a, b) => new Date(a.Date) - new Date(b.Date)).forEach((r, idx) => {
                    if (tempGroup.length === 0) {
                        tempGroup.push(r);
                    } else {
                        const diffDays = Math.ceil(Math.abs(new Date(r.Date) - new Date(tempGroup[tempGroup.length - 1].Date)) / (1000 * 60 * 60 * 24));
                        if (diffDays === 1 && tempGroup[0].Leave === r.Leave) tempGroup.push(r);
                        else { groupedLeaves.push(tempGroup); tempGroup = [r]; }
                    }
                    if (idx === filteredRecords.length - 1) groupedLeaves.push(tempGroup);
                });

                groupedLeaves.sort((a, b) => new Date(b[0].Date) - new Date(a[0].Date));

                container.innerHTML = groupedLeaves.map(group => {
                    const firstDate = group[0].Date;
                    const endDate = group[group.length - 1].Date;
                    const status = group[0].StatusApproval || 'Pending'; // Di Leave, Pending itu SAH.
                    
                    return `
                    <div class="history-card p-3 rounded-xl border border-amber-500/20 bg-amber-500/5 space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="text-[11px] font-mono text-amber-400 font-bold">${firstDate === endDate ? firstDate : `${firstDate} Thru ${endDate}`}</span>
                            <span class="text-[9px] px-2 py-0.5 rounded bg-white/5 border border-white/10 font-bold uppercase ${status === 'Approved' ? 'text-green-400' : 'text-amber-400'}">${status}</span>
                        </div>
                        <div class="text-xs font-bold text-white uppercase tracking-wider">🎯 ${group[0].Leave}</div>
                    </div>`;
                }).join('');
                return;
            }

            // Tampilan Khusus Tab Attendance
            container.innerHTML = filteredRecords.map(r => {
                let statusText = 'Attend';
                let statusColor = 'text-sky-400 border-sky-500/30 bg-sky-500/10';

                if (r.F1 && r.F4 && r.F4 !== '-') {
                    statusText = 'Complete';
                    statusColor = 'text-green-400 border-green-500/30 bg-green-500/10';
                } else if (r.F1 && (!r.F4 || r.F4 === '-') && r.Date < todayStr) {
                    statusText = 'No Clock out';
                    statusColor = 'text-yellow-400 border-yellow-500/30 bg-yellow-500/10';
                }

                // 🚀 PERBAIKAN: Hapus total jejak Pending dari UI Attendance Normal
                let attendanceStatus = '';
                let attStatusColor = 'text-slate-400 opacity-40';
                
                if (r.StatusApproval === 'On Time') {
                    attendanceStatus = 'On Time';
                    attStatusColor = 'text-emerald-400';
                } else if (r.StatusApproval === 'Late') {
                    attendanceStatus = 'Late';
                    attStatusColor = 'text-rose-400';
                }

                return `
                <div class="history-card p-3 rounded-xl border border-white/10">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[11px] font-mono text-sky-400 font-bold">${r.Date}</span>
                        <span class="text-[9px] px-2.5 py-0.5 rounded border font-bold uppercase ${statusColor}">${statusText}</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="bg-black/30 p-2 rounded-lg text-center">
                            <span class="text-[8px] uppercase tracking-wider text-white/70 font-bold block mb-1">In</span>
                            <span class="text-xs font-mono text-white font-bold">${r.F1 || '--:--'}</span>
                        </div>
                        <div class="bg-black/30 p-2 rounded-lg text-center">
                            <span class="text-[8px] uppercase tracking-wider text-white/70 font-bold block mb-1">Out</span>
                            <span class="text-xs font-mono text-white font-bold">${r.F4 || (r.Date < todayStr ? '-' : '--:--')}</span>
                        </div>
                        <div class="bg-black/30 p-2 rounded-lg text-center overflow-hidden">
                            <span class="text-[8px] uppercase tracking-wider text-white/70 font-bold block mb-1">Status</span>
                            <span class="text-[9px] font-extrabold uppercase truncate block ${attStatusColor}">${attendanceStatus || '-'}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // 🚀 PERBAIKAN: Kalkulasi MURNI berdasar waktu yang valid saja (HAPUS FALLBACK EXPIRED)
        function calculatePunchStatus(f1Time, dateStr, user) {
            if (!f1Time || !user) return "";
            const shifts = masterData.shifts || [];

            const userUnit = String(user.UnitCode || '').trim().toLowerCase();
            const userCrew = String(user.Crew || '').trim().toLowerCase();

            const parseDateToTime = (d) => {
                if (!d) return 0;
                const s = d.toString().trim();
                if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(s)) {
                    const p = s.split(/[-/]/);
                    return new Date(p[0], p[1] - 1, p[2].substring(0, 2)).getTime();
                }
                if (/^\d{1,2}[-/]\d{1,2}[-/]\d{4}/.test(s)) {
                    const p = s.split(/[-/]/);
                    return new Date(p[2], p[1] - 1, p[0]).getTime();
                }
                return new Date(s).getTime() || 0;
            };

            const targetTime = parseDateToTime(dateStr);

            const matchedShift = shifts.find(s => {
                const matchUnit = String(s.UnitCode || '').trim().toLowerCase() === userUnit;
                const matchCrew = String(s.Crew || '').trim().toLowerCase() === userCrew;
                const fromTime = parseDateToTime(s.EffectiveFrom);
                const untilTime = parseDateToTime(s.EffectiveUntil);
                return matchUnit && matchCrew && targetTime >= fromTime && targetTime <= untilTime && s.TimeStart;
            });

            if (!matchedShift) return ""; 

            const toMinutes = (t) => {
                if (!t) return 0;
                const parts = t.toString().trim().split(':');
                return (parseInt(parts[0], 10) * 60) + (parseInt(parts[1], 10) || 0);
            };

            const punchMinutes = toMinutes(f1Time);
            const shiftStartMinutes = toMinutes(matchedShift.TimeStart);

            return punchMinutes <= shiftStartMinutes ? "On Time" : "Late";
        }
        
        async function recordAttendance(type) {
            if (!await isDeviceValid()) return;
            loader.style.display = 'flex';
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const attendanceList = masterData.attendance || [];

            const myRecords = attendanceList.filter(r => 
                String(r.EmployeeId).trim() === String(currentUser.EmployeeId).trim()
            );
            
            // 🚀 PERBAIKAN: Abaikan record Leave sepenuhnya saat Clock In/Out normal
            const unclosedSession = myRecords.find(r => 
                !isLeaveRecordCheck(r) &&
                r.F1 && String(r.F1).trim() !== '-' && String(r.F1).trim() !== '' && 
                (!r.F4 || String(r.F4).trim() === '' || String(r.F4).trim() === '-')
            );

            if (type === 'F1' && unclosedSession) {
                loader.style.display = 'none';
                Swal.fire({ icon: 'warning', title: 'Clock In Ditolak', text: `Anda masih memiliki sesi Clock In pada tanggal ${unclosedSession.Date} (${unclosedSession.F1}) yang belum Clock Out (F4).`, background: '#151921', color: '#fff' });
                return;
            }

            if (type === 'F4' && !unclosedSession) {
                loader.style.display = 'none';
                Swal.fire({ icon: 'warning', title: 'Belum Clock In', text: 'Anda belum melakukan Clock In (F1).', background: '#151921', color: '#fff' });
                return;
            }

            let payload;
            let currentStatus = "";

            if (type === 'F1') {
                currentStatus = calculatePunchStatus(timeStr, dateStr, currentUser); // Hanya "On Time", "Late", atau ""

                payload = {
                    tab: 'ATTENDANCE_RECORD',
                    action: 'add',
                    primaryId: `${currentUser.EmployeeId}|${dateStr}`,
                    EmployeeId: currentUser.EmployeeId,
                    Date: dateStr,
                    F1: timeStr,
                    F4: '',
                    Leave: '',
                    StatusApproval: currentStatus,
                    "Status Approval": currentStatus
                };
            } else if (type === 'F4') {
                const targetDate = unclosedSession ? unclosedSession.Date : dateStr;
                const f1Time = unclosedSession?.F1 || timeStr;

                // 🚀 PERBAIKAN: F4 WAJIB mempertahankan / mewarisi status dari F1 secara buta.
                if (unclosedSession) {
                    if (unclosedSession.StatusApproval === 'On Time') {
                        currentStatus = 'On Time';
                    } else if (unclosedSession.StatusApproval === 'Late') {
                        currentStatus = 'Late';
                    } else {
                        currentStatus = '';
                    }
                }

                payload = {
                    tab: 'ATTENDANCE_RECORD',
                    action: 'update',
                    primaryId: `${currentUser.EmployeeId}|${targetDate}`,
                    EmployeeId: currentUser.EmployeeId,
                    Date: targetDate,
                    F1: f1Time,
                    F4: timeStr,
                    Leave: '', // F4 tidak mencampur urusan leave
                    StatusApproval: currentStatus,
                    "Status Approval": currentStatus
                };
            }

            try {
                let res = await API.post(payload);

                if (res && res.status === 'error' && res.message && res.message.includes('Record not found')) {
                    payload.action = 'add';
                    res = await API.post(payload);
                }

                if (res && res.status === 'success') {
                    if (type === 'F1') {
                        masterData.attendance.push(payload);
                    } else if (type === 'F4') {
                        if (unclosedSession) {
                            unclosedSession.F4 = timeStr;
                            unclosedSession.StatusApproval = currentStatus;
                        }
                    }

                    showMainInterface();
                    loader.style.display = 'none';

                    Swal.fire({ icon: 'success', title: 'Committed', text: `${type} berhasil dicatat pada jam ${timeStr}`, background: '#151921', color: '#fff', timer: 1500, showConfirmButton: false });
                    if (API.clearLocalCache) API.clearLocalCache('ATTENDANCE_RECORD');
                } else {
                    throw new Error(res?.message || 'Gagal menyimpan presensi');
                }
            } catch (e) { 
                loader.style.display = 'none';
                Swal.fire({ icon: 'error', title: 'Error', text: e.message, background: '#151921', color: '#fff' }); 
            } 
        }
        
        async function recordLeave() {
            if (!await isDeviceValid()) return; // 👈 Tambahkan await
            
            const leave = document.getElementById('leaveType').value;
            const startStr = document.getElementById('startDate').value;
            const untilStr = document.getElementById('untilDate').value;

            if (!leave) {
                Swal.fire({ icon: 'warning', title: 'Pilih Jenis Cuti', background: '#151921', color: '#fff' });
                return;
            }
            if (!startStr || !untilStr) {
                Swal.fire({ icon: 'warning', title: 'Tentukan Tanggal Mulai dan Selesai', background: '#151921', color: '#fff' });
                return;
            }

            const startDate = new Date(startStr);
            const untilDate = new Date(untilStr);

            if (startDate > untilDate) {
                Swal.fire({ icon: 'error', title: 'Tanggal "Until" harus setelah "Start"', background: '#151921', color: '#fff' });
                return;
            }

            loader.style.display = 'flex';
            const attendanceList = masterData.attendance || [];

            try {
                let currDate = new Date(startDate);
                let promises = [];

                while (currDate <= untilDate) {
                    const year = currDate.getFullYear();
                    const month = String(currDate.getMonth() + 1).padStart(2, '0');
                    const day = String(currDate.getDate()).padStart(2, '0');
                    const dateStr = `${year}-${month}-${day}`;

                    const existingRec = attendanceList.find(r => r.Date === dateStr && String(r.EmployeeId).trim() === String(currentUser.EmployeeId).trim());

                    const payload = {
                        tab: 'ATTENDANCE_RECORD',
                        action: existingRec ? 'update' : 'add',
                        EmployeeId: currentUser.EmployeeId,
                        Date: dateStr,
                        F1: existingRec?.F1 || '-',
                        F4: existingRec?.F4 || '-',
                        Leave: leave,
                        StatusApproval: 'Pending',
                        primaryId: `${currentUser.EmployeeId}|${dateStr}`
                    };

                    // Optimistic update lokal
                    if (existingRec) {
                        existingRec.Leave = leave;
                    } else {
                        masterData.attendance.push(payload);
                    }

                    promises.push(API.post(payload));
                    currDate.setDate(currDate.getDate() + 1);
                }

                // Kirim paralel
                await Promise.all(promises);

                showMainInterface();
                loader.style.display = 'none';

                Swal.fire({ 
                    icon: 'success', 
                    title: 'Proposals Submitted', 
                    text: `Cuti/Izin dari ${startStr} s.d ${untilStr} berhasil diajukan.`, 
                    background: '#151921', 
                    color: '#fff' 
                });

                if (API.clearLocalCache) API.clearLocalCache('ATTENDANCE_RECORD');
            } catch (e) { 
                loader.style.display = 'none';
                Swal.fire({ icon: 'error', title: 'Error', text: e.message, background: '#151921', color: '#fff' }); 
            }
        }

        function startClock() { setInterval(() => { document.getElementById('display-clock').innerText = new Date().toLocaleTimeString('en-GB'); document.getElementById('display-date').innerText = new Date().toDateString(); }, 1000); }
        
        init();
    </script>
