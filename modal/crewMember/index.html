<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../../api.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #151921; --panel: #1c222c; --border: rgba(255, 255, 255, 0.08); --accent: #0ea5e9; --text-main: #94a3b8; --text-bold: #ffffff; }
        body { background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 1.5rem; }
        .glass-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 1.5rem; transition: all 0.3s ease; }
        
        .input-field { 
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); 
            border-radius: 0.75rem; padding: 0.65rem 0.75rem; color: white; outline: none; 
            font-size: 0.8rem; transition: all 0.2s ease; 
        }
        .input-field:hover { border-color: rgba(255, 255, 255, 0.2); }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2); }
        
        .btn-primary { 
            background: var(--accent); color: white; font-weight: 700; text-transform: uppercase; 
            padding: 0.7rem; border-radius: 0.75rem; transition: all 0.2s; font-size: 11px; 
            letter-spacing: 0.05em; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2); 
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        #local-loader { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        select option { background-color: #1c222c; color: #fff; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="max-w-2xl mx-auto">

    <div id="local-loader">
        <div class="w-8 h-8 border-4 border-sky-500/20 border-t-sky-500 rounded-full animate-spin mb-3"></div>
        <p class="text-[10px] font-mono uppercase tracking-widest text-sky-500">Loading_Crew...</p>
    </div>

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 id="modal-subtitle" class="text-xs font-mono text-sky-500 uppercase tracking-widest">UNIT // CREW</h2>
            <h1 class="text-xl font-bold text-white uppercase">Crew Member Management</h1>
        </div>
        <button onclick="window.parent.closeCrewModal()" class="p-2 bg-white/5 hover:bg-white/10 rounded-full text-white/50 hover:text-white transition"><i data-lucide="x" size="18"></i></button>
    </div>

    <!-- TOMBOL TOGGLE FORM TAMBAH ANGGOTA -->
    <div class="mb-4">
        <button onclick="toggleAddForm()" id="toggle-form-btn" class="w-full py-3 px-4 bg-sky-600/10 hover:bg-sky-600/25 border border-sky-500/20 text-sky-400 rounded-2xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition">
            <i data-lucide="user-plus" size="16"></i> <span id="toggle-text">Show Add New Member Form</span>
        </button>
    </div>

    <!-- FORM TAMBAH ANGGOTA BARU (TERSEMBUNYI SECARA DEFAULT) -->
    <form id="add-member-form" class="glass-panel p-4 mb-6 grid grid-cols-1 sm:grid-cols-3 gap-3 hidden">
        <input type="text" id="newId" class="input-field font-mono" placeholder="Employee ID">
        <input type="text" id="newName" class="input-field" placeholder="Full Name">
        <input type="text" id="newJob" class="input-field" placeholder="Job Title">
        <select id="newClass" class="input-field text-xs">
            <option value="Employee">Employee</option>
            <option value="OJT">OJT</option>
            <option value="Additional Employee">Additional Employee</option>
        </select>
        <input type="password" id="newPass" class="input-field font-mono" placeholder="Password (Optional)">
        <button type="submit" class="btn-primary flex items-center justify-center gap-1"><i data-lucide="check" size="14"></i> Commit New Member</button>
    </form>

    <!-- TABEL DAFTAR ANGGOTA -->
    <div class="glass-panel overflow-hidden">
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/[0.01]">
            <span class="text-xs font-bold uppercase text-white tracking-wider">Registered Personnel</span>
            <span id="member-count" class="text-[10px] font-mono bg-sky-500/10 text-sky-400 px-2 py-0.5 rounded border border-sky-500/20">0 PAX</span>
        </div>
        <div class="overflow-x-auto max-h-[300px]">
            <table class="w-full text-left text-xs">
                <thead class="bg-black/20 text-[10px] uppercase opacity-60 sticky top-0">
                    <tr>
                        <th class="p-3">ID</th>
                        <th class="p-3">Name</th>
                        <th class="p-3">Job Title</th>
                        <th class="p-3">Class</th>
                        <th class="p-3 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="member-list" class="divide-y divide-white/5">
                    <!-- Data injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const loader = document.getElementById('local-loader');
        
        const urlParams = new URLSearchParams(window.location.search);
        const targetUnit = decodeURIComponent(urlParams.get('unit') || '').trim();
        const targetCrew = decodeURIComponent(urlParams.get('crew') || '').trim();

        document.getElementById('modal-subtitle').innerText = `${targetUnit} // ${targetCrew}`;

        let allUsers = [];
        let allUnits = [];
        let allShifts = [];

        async function init() {
            try {
                try { if (window.parent && window.parent.clearCache) { window.parent.clearCache('USER'); window.parent.clearCache('UNIT'); window.parent.clearCache('SHIFTS'); } } catch(e) {}
                await API._dbOp("delete", "USER");

                const [usrRes, unitRes, shiftRes] = await Promise.all([
                    API.get('USER'),
                    API.get('UNIT'),
                    API.get('SHIFTS')
                ]);
                
                allUsers = usrRes.data || [];
                allUnits = unitRes.data || [];
                allShifts = shiftRes.data || [];
                
                renderMembers();
            } catch (e) {
                Swal.fire({ icon: 'error', title: 'Error', text: e.message, background: '#151921', color: '#fff' });
            } finally {
                loader.style.display = 'none';
            }
        }

        // Toggle Form Tambah Anggota
        function toggleAddForm() {
            const form = document.getElementById('add-member-form');
            const text = document.getElementById('toggle-text');
            form.classList.toggle('hidden');
            if (!form.classList.contains('hidden')) {
                text.innerText = "Hide Form";
                form.reset(); // Selalu kosong saat dibuka
            } else {
                text.innerText = "Show Add New Member Form";
            }
        }

        function renderMembers() {
            const listContainer = document.getElementById('member-list');
            const members = allUsers.filter(u => 
                String(u.UnitCode || '').trim().toLowerCase() === targetUnit.toLowerCase() && 
                String(u.Crew || '').trim().toLowerCase() === targetCrew.toLowerCase()
            );
            
            document.getElementById('member-count').innerText = `${members.length} PAX`;

            if (members.length === 0) {
                listContainer.innerHTML = `<tr><td colspan="5" class="p-6 text-center opacity-30 uppercase font-mono text-[10px]">No members registered in this crew</td></tr>`;
                return;
            }

            listContainer.innerHTML = members.map(m => `
                <tr class="hover:bg-white/[0.02] transition">
                    <td class="p-3 font-mono text-sky-400">${m.EmployeeId}</td>
                    <td class="p-3 font-bold text-white">${m.Name}</td>
                    <td class="p-3 opacity-70">${m.JobTitle || '-'}</td>
                    <td class="p-3"><span class="bg-white/5 px-2 py-0.5 rounded text-[10px]">${m.Class || 'Employee'}</span></td>
                    <td class="p-3 text-right">
                        <button onclick='openActionMenu(${JSON.stringify(m)})' class="p-1.5 bg-white/5 hover:bg-sky-500/20 text-sky-400 rounded-lg transition"><i data-lucide="more-vertical" size="14"></i></button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        // MENU TITIK TIGA (ACTION: TRANSFER UNIT & CREW YANG TERSEDIA, RESET PASSWORD, RESET DEVICE, DELETE)
        async function openActionMenu(member) {
            const unitOptions = allUnits.map(u => `<option value="${u.UnitCode}" ${u.UnitCode === member.UnitCode ? 'selected' : ''}>${u.UnitCode}</option>`).join('');
            
            // Ambil daftar crew unik yang ada di database shifts / users untuk unit tersebut
            const existingCrews = [...new Set(allShifts.concat(allUsers).filter(x => x.Crew).map(x => String(x.Crew).trim()))];
            const crewOptions = existingCrews.map(c => `<option value="${c}" ${c === member.Crew ? 'selected' : ''}>${c}</option>`).join('');

            const actionModal = await Swal.fire({
                title: `<span style="font-size:16px; color:#fff;">Manage: ${member.Name}</span>`,
                html: `
                    <div style="text-align: left; font-size: 12px; display: flex; flex-direction: column; gap: 10px; color: #94a3b8;">
                        <div>
                            <label style="font-weight:700; text-transform:uppercase; font-size:9px; display:block; margin-bottom:4px;">Transfer to Unit</label>
                            <select id="swal-unit" class="input-field" style="background:#0b0e14; color:#fff; border:1px solid rgba(255,255,255,0.1); padding:8px; border-radius:8px; width:100%;">${unitOptions}</select>
                        </div>
                        <div>
                            <label style="font-weight:700; text-transform:uppercase; font-size:9px; display:block; margin-bottom:4px;">Transfer to Crew (Select or Type)</label>
                            <input list="crew-list" id="swal-crew" class="input-field" value="${member.Crew || ''}" style="background:#0b0e14; color:#fff; border:1px solid rgba(255,255,255,0.1); padding:8px; border-radius:8px; width:100%;" placeholder="Select or type crew...">
                            <datalist id="crew-list">${crewOptions}</datalist>
                        </div>
                        <hr style="border-color: rgba(255,255,255,0.1); margin: 5px 0;">
                        <div style="display:flex; gap:10px;">
                            <button id="swal-btn-pass" type="button" class="btn-primary" style="flex:1; background:#334155; font-size:10px;">Reset Password</button>
                            <button id="swal-btn-dev" type="button" class="btn-primary" style="flex:1; background:#334155; font-size:10px;">Unbind Device</button>
                        </div>
                        <button id="swal-btn-del" type="button" class="btn-primary" style="background:#ef4444; font-size:10px; margin-top:5px;">Remove From Database</button>
                    </div>
                `,
                background: '#151921',
                showCancelButton: true,
                confirmButtonText: 'Save Changes',
                confirmButtonColor: '#0ea5e9',
                cancelButtonColor: '#334155',
                didOpen: () => {
                    document.getElementById('swal-btn-pass').onclick = async () => {
                        const defaultPass = `Aeroas1@${String(member.EmployeeId).slice(-2)}`;
                        loader.style.display = 'flex';
                        Swal.close();
                        await API.post({ tab: 'USER', action: 'update', primaryId: member.EmployeeId, Password: defaultPass });
                        await refreshData();
                        Swal.fire({ icon: 'success', title: 'Password Reset', text: `Password baru: ${defaultPass}`, background: '#151921', color: '#fff' });
                    };

                    document.getElementById('swal-btn-dev').onclick = async () => {
                        loader.style.display = 'flex';
                        Swal.close();
                        await API.post({ tab: 'USER', action: 'update', primaryId: member.EmployeeId, "DeviceId(phone)": "" });
                        await refreshData();
                        Swal.fire({ icon: 'success', title: 'Device Unbound', text: 'Perangkat berhasil dilepas.', background: '#151921', color: '#fff' });
                    };

                    document.getElementById('swal-btn-del').onclick = async () => {
                        Swal.close();
                        deleteMember(member.EmployeeId);
                    };
                },
                preConfirm: () => {
                    return {
                        UnitCode: document.getElementById('swal-unit').value,
                        Crew: document.getElementById('swal-crew').value.trim()
                    }
                }
            });

            if (actionModal.isConfirmed) {
                loader.style.display = 'flex';
                try {
                    const updates = actionModal.value;
                    await API.post({
                        tab: 'USER',
                        action: 'update',
                        primaryId: member.EmployeeId,
                        UnitCode: updates.UnitCode,
                        Crew: updates.Crew
                    });
                    await refreshData();
                    Swal.fire({ icon: 'success', title: 'Member Transferred', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, background: '#151921', color: '#fff' });
                } catch (err) {
                    Swal.fire({ icon: 'error', title: 'Failed', text: err.message, background: '#151921', color: '#fff' });
                } finally {
                    loader.style.display = 'none';
                }
            }
        }

        async function refreshData() {
            try {
                if (window.parent && window.parent.clearCache) window.parent.clearCache('USER');
                await API._dbOp("delete", "USER");
                const usr = await API.get('USER');
                allUsers = usr.data || [];
                renderMembers();
            } catch(e) {}
        }

        document.getElementById('add-member-form').onsubmit = async (e) => {
            e.preventDefault();
            loader.style.display = 'flex';

            const empId = document.getElementById('newId').value.trim();
            const pass = document.getElementById('newPass').value.trim();

            const payload = {
                tab: 'USER',
                action: 'add',
                UnitCode: targetUnit,
                Crew: targetCrew,
                EmployeeId: empId,
                Name: document.getElementById('newName').value.trim(),
                JobTitle: document.getElementById('newJob').value.trim(),
                Class: document.getElementById('newClass').value,
                Password: pass,
                "DeviceId(phone)": "" 
            };

            try {
                const res = await API.post(payload);
                if (res.status === 'success') {
                    await refreshData();
                    document.getElementById('add-member-form').reset();
                    toggleAddForm(); // Otomatis menutup form setelah sukses
                    Swal.fire({ icon: 'success', title: 'Member Added', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, background: '#151921', color: '#fff' });
                } else {
                    throw new Error(res.message);
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Failed', text: err.message, background: '#151921', color: '#fff' });
            } finally {
                loader.style.display = 'none';
            }
        };

        async function deleteMember(empId) {
            const confirm = await Swal.fire({ title: 'Remove Member?', text: `Hapus employee ID ${empId} dari database?`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', background: '#151921', color: '#fff' });
            if (confirm.isConfirmed) {
                loader.style.display = 'flex';
                try {
                    const res = await API.post({ tab: 'USER', action: 'delete', primaryId: empId });
                    if (res.status === 'success') {
                        await refreshData();
                    }
                } catch (e) {
                    Swal.fire({ icon: 'error', title: 'Error', text: e.message, background: '#151921', color: '#fff' });
                } finally {
                    loader.style.display = 'none';
                }
            }
        }

        init();
    </script>
</body>
</html>
