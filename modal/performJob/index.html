<div id="performJobModal" class="fixed inset-0 z-[999] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
    <div class="bg-[#151921] border border-white/10 rounded-[2.5rem] w-full max-w-4xl max-h-[92vh] shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
        
        <!-- Header -->
        <div class="p-6 border-b border-white/5 flex justify-between items-start bg-white/[0.02]">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="bg-sky-500/10 border border-sky-500/20 text-sky-400 font-mono text-[10px] font-bold px-2 py-0.5 rounded-lg uppercase tracking-wider">JOB EXECUTION & TIMER</span>
                    <span id="pj-node" class="text-xs font-mono font-bold text-white/40"></span>
                </div>
                <h2 id="pj-order-title" class="text-2xl font-black text-white font-mono tracking-tight">ORDER #</h2>
                <p id="pj-desc" class="text-xs text-white/70 mt-1 line-clamp-2 leading-relaxed"></p>
            </div>
            <button onclick="closePerformJobModal()" class="p-2 hover:bg-white/10 rounded-full text-white/40 hover:text-white transition">
                <i data-lucide="x" size="20"></i>
            </button>
        </div>

        <!-- Body Scrollable -->
        <div class="p-6 overflow-y-auto space-y-6 flex-1 text-xs custom-scrollbar">
            
            <!-- SECTION 1: TIMER COCKPIT -->
            <div class="bg-black/40 border border-white/10 rounded-3xl p-6 text-center flex flex-col items-center justify-center relative overflow-hidden">
                <span class="text-[9px] font-mono uppercase tracking-[0.3em] text-white/40 font-bold mb-1">Work Execution Duration</span>
                
                <!-- Display Durasi Format (s min H) -->
                <div id="timer-display" class="text-5xl md:text-6xl font-black font-mono tracking-wider text-white my-2 tabular-nums">
                    00<span class="text-xs text-sky-400 font-normal ml-1 mr-2 font-sans">h</span>00<span class="text-xs text-sky-400 font-normal ml-1 mr-2 font-sans">m</span>00<span class="text-xs text-sky-400 font-normal ml-1 font-sans">s</span>
                </div>

                <div id="timer-timestamp-info" class="text-[10px] font-mono text-white/40 mb-5 flex flex-wrap items-center justify-center gap-3">
                    <span>Start: <b id="stamp-start" class="text-white/80">--:--:--</b></span>
                    <span>&bull;</span>
                    <span>Pause: <b id="stamp-pause" class="text-amber-400">--:--:--</b></span>
                    <span>&bull;</span>
                    <span>Stop: <b id="stamp-stop" class="text-white/80">--:--:--</b></span>
                </div>

                <!-- Timer Controls -->
                <div class="flex flex-wrap items-center justify-center gap-3">
                    <button id="btn-timer-start" onclick="handleStartJob()" class="px-6 py-3 bg-sky-600 hover:bg-sky-500 text-white rounded-2xl font-bold uppercase tracking-wider text-[11px] flex items-center gap-2 shadow-lg shadow-sky-600/20 active:scale-95 transition-all">
                        <i data-lucide="play" size="14"></i> <span id="label-start">Start Job</span>
                    </button>
                    <button id="btn-timer-pause" onclick="handlePauseJob()" disabled class="px-5 py-3 bg-amber-600/20 text-amber-400 border border-amber-500/30 hover:bg-amber-600 hover:text-white rounded-2xl font-bold uppercase tracking-wider text-[11px] flex items-center gap-2 disabled:opacity-20 disabled:cursor-not-allowed transition-all">
                        <i data-lucide="pause" size="14"></i> Pause
                    </button>
                    <button id="btn-timer-stop" onclick="handleStopJob()" disabled class="px-6 py-3 bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600 hover:text-white rounded-2xl font-bold uppercase tracking-wider text-[11px] flex items-center gap-2 disabled:opacity-20 disabled:cursor-not-allowed transition-all">
                        <i data-lucide="square" size="14"></i> Stop & Record
                    </button>
                </div>
            </div>

            <!-- SECTION 2: AUTHENTICATED OPERATOR INFO (LOCKED TO LOGIN USER) -->
            <div class="bg-white/[0.02] border border-white/5 p-4 rounded-2xl flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-sky-400 font-bold font-mono">
                        <i data-lucide="user-check" size="18"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-white" id="op-auth-name">Loading Operator...</span>
                            <span class="bg-sky-500/10 text-sky-400 text-[9px] font-mono px-1.5 py-0.2 rounded border border-sky-500/20 font-bold" id="op-auth-class">Employee</span>
                        </div>
                        <p class="text-[10px] text-white/40 font-mono mt-0.5" id="op-auth-sub"></p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-[9px] uppercase tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-1 rounded-lg font-bold">Authorized Session</span>
                </div>
            </div>

            <!-- SECTION 3: WHO IS HANDLING THIS ORDER (READ FROM JOB RECORD, GROUPED BY CLASS) -->
            <details open class="group space-y-3">
                <summary class="flex justify-between items-center cursor-pointer select-none bg-white/[0.02] border border-white/5 p-4 rounded-2xl hover:bg-white/[0.04] transition">
                    <div class="flex items-center gap-2">
                        <i data-lucide="chevron-down" class="w-4 h-4 text-sky-400 group-open:rotate-180 transition-transform"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest text-sky-400">Who is Handling this order (Job Records by Class)</span>
                    </div>
                    <span id="pj-history-count" class="text-[9px] font-mono text-white/40 bg-white/5 px-2 py-0.5 rounded-md">Loading Records...</span>
                </summary>

                <!-- Class Group Accordions Injected Here -->
                <div id="class-roster-container" class="space-y-3 pt-2">
                    <!-- Injected via JS -->
                </div>
            </details>

        </div>
    </div>
</div>

<style>
    /* Styling scrollbar vertikal tema dark */
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #0ea5e9; }

    details > summary { list-style: none; outline: none; }
    details > summary::-webkit-details-marker { display: none; }
</style>

<script>
(function() {
    lucide.createIcons();

    // 1. SUPABASE CLIENT & KONFIGURASI
    const S_URL = 'https://tskcxblanrtvzlctpcyd.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRza2N4YmxhbnJ0dnpsY3RwY3lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcwNjI0MjAsImV4cCI6MjA4MjYzODQyMH0.6epAPJdzgxe-pmG-rVtosdbg-dwF5lND6Xd18VgUeU0';
    let sbClient = null;
    try {
        if (typeof supabase !== 'undefined' && supabase.createClient) {
            sbClient = supabase.createClient(S_URL, S_KEY);
        } else if (window.parent && window.parent.supabaseClient) {
            sbClient = window.parent.supabaseClient;
        }
    } catch(e) {}

    const SUPABASE_MAP = {
        'TCR-1': { colStatus: 'status_sm1', colDate: 'date_closed_sm1', remarkKey: 'remark_sm1' },
        'TCR-2': { colStatus: 'status_cs1', colDate: 'date_closed_cs1', remarkKey: 'remark_cs1' },
        'TCR-3': { colStatus: 'status_sm4', colDate: 'date_closed_sm4', remarkKey: 'remark_sm4' },
        'TCR-4': { colStatus: 'status_cs4', colDate: 'date_closed_cs4', remarkKey: 'remark_cs4' },
        'TCR-5': { colStatus: 'status_mw',  colDate: 'date_closed_mw',  remarkKey: 'remark_mw' }
    };

    // 2. CEK KONTEKS ORDER & UNIT
    const jobContext = window.activePerformJob || {};
    const unitCode = String(jobContext.unitCode || 'TCP-9').trim();
    const orderNo = String(jobContext.orderNo || '-').trim();

    document.getElementById('pj-node').innerText = `${unitCode} // A/C: ${jobContext.acReg || '-'}`;
    document.getElementById('pj-order-title').innerText = `ORDER #${orderNo}`;
    document.getElementById('pj-desc').innerText = jobContext.description || 'No description provided';

    // 3. VERIFIKASI SESI LOGIN
    const savedUserStr = localStorage.getItem('tc_user');
    if (!savedUserStr) {
        Swal.fire({
            icon: 'warning',
            title: 'Authentication Required',
            text: 'Anda harus login terlebih dahulu untuk melakukan pekerjaan ini.',
            background: '#151921',
            color: '#fff',
            confirmButtonColor: '#0ea5e9'
        }).then(() => {
            const modal = document.getElementById('performJobModal');
            if (modal) modal.remove();
        });
        return;
    }

    const currentUser = JSON.parse(savedUserStr);
    const userUnit = String(currentUser.UnitCode || '').trim();

    // 4. VERIFIKASI KECOCOKAN UNIT CODE
    if (userUnit.toLowerCase() !== unitCode.toLowerCase()) {
        Swal.fire({
            icon: 'error',
            title: 'Akses Ditolak',
            text: `Maaf, Anda tidak diizinkan untuk handle pekerjaan ${unitCode}. Silakan pergi ke Unit Anda (${userUnit || 'Unassigned'}).`,
            background: '#151921',
            color: '#fff',
            confirmButtonColor: '#ef4444'
        }).then(() => {
            const modal = document.getElementById('performJobModal');
            if (modal) modal.remove();
        });
        return;
    }

    document.getElementById('op-auth-name').innerText = currentUser.Name || currentUser.EmployeeId;
    document.getElementById('op-auth-class').innerText = currentUser.Class || 'Employee';
    document.getElementById('op-auth-sub').innerText = `ID: ${currentUser.EmployeeId} &bull; Unit: ${userUnit} &bull; ${currentUser.JobTitle || 'Staff'}`;

    // Timer & Record State
    let timerInterval = null;
    let secondsElapsed = 0;
    let isRunning = false;
    let isPaused = false;
    let isExistingSession = false; // Flag apakah melanjutkan sesi yang sudah ada di sheet
    
    let dateStartStr = '';
    let timeStartStr = '';
    let datePauseStr = '';
    let timePauseStr = '';
    let dateStopStr = '';
    let timeStopStr = '';

    window.closePerformJobModal = function() {
        if (isRunning) {
            Swal.fire({
                title: 'Timer Masih Berjalan!',
                text: 'Pencatatan waktu sedang aktif. Pause atau Stop sebelum menutup modul.',
                icon: 'warning',
                background: '#151921',
                color: '#fff',
                confirmButtonColor: '#0ea5e9'
            });
            return;
        }
        clearInterval(timerInterval);
        const modal = document.getElementById('performJobModal');
        if (modal) modal.remove();
    };

    function formatDurationDisplay(totalSeconds) {
        const s = Math.max(0, parseInt(totalSeconds) || 0);
        const hrs = Math.floor(s / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const secs = s % 60;
        
        return `${String(hrs).padStart(2,'0')}<span class="text-xs text-sky-400 font-normal ml-1 mr-2 font-sans">h</span>` +
               `${String(mins).padStart(2,'0')}<span class="text-xs text-sky-400 font-normal ml-1 mr-2 font-sans">m</span>` +
               `${String(secs).padStart(2,'0')}<span class="text-xs text-sky-400 font-normal ml-1 font-sans">s</span>`;
    }

    function formatSecToReadable(totalSeconds) {
        const s = parseInt(totalSeconds) || 0;
        const hrs = Math.floor(s / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const secs = s % 60;
        if (hrs > 0) return `${hrs}h ${mins}m ${secs}s`;
        if (mins > 0) return `${mins}m ${secs}s`;
        return `${secs}s`;
    }

    function getCurrentTimeClock() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }

    function getCurrentDateIso() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // Helper konversi tanggal dan jam ke milidetik
    function parseDateToMs(dateStr, timeStr) {
        if (!dateStr || !timeStr) return null;
        try {
            const cleanDate = dateStr.trim();
            const cleanTime = timeStr.trim();
            const [y, m, d] = cleanDate.split('-').map(Number);
            const [hh, mm, ss] = cleanTime.split(':').map(Number);
            return new Date(y, m - 1, d, hh, mm, ss || 0).getTime();
        } catch(e) { return null; }
    }

    const PALETTES = [
        { text: 'text-sky-400', badge: 'bg-sky-500/20 text-sky-300' },
        { text: 'text-purple-400', badge: 'bg-purple-500/20 text-purple-300' },
        { text: 'text-emerald-400', badge: 'bg-emerald-500/20 text-emerald-300' },
        { text: 'text-amber-400', badge: 'bg-amber-500/20 text-amber-300' },
        { text: 'text-rose-400', badge: 'bg-rose-500/20 text-rose-300' }
    ];

    function getDynamicColor(str) {
        let hash = 0;
        const text = String(str || 'Class');
        for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
        return PALETTES[Math.abs(hash) % PALETTES.length];
    }

    // 🚀 LOAD RIWAYAT & RECOVERY OTOMATIS JIKA DEVICE DI-REFRESH
    async function loadJobRecordsHistory() {
        const countSpan = document.getElementById('pj-history-count');
        const container = document.getElementById('class-roster-container');

        try {
            // Hapus cache lokal dulu agar selalu membaca data terbaru dari spreadsheet
            if (API.clearLocalCache) await API.clearLocalCache('JOB RECORD');

            const [jobRes, userRes] = await Promise.all([
                API.get('JOB RECORD'),
                API.get('USER')
            ]);

            const allJobs = jobRes.data || [];
            const allUsers = userRes.data || [];

            // 🚀 PERIKSA: APAKAH USER MEMILIKI TANGGUNGAN ORDER LAIN YANG MASIH BERJALAN?
            const otherPendingJob = allJobs.find(j => 
                String(j.EmployeeId).trim() === String(currentUser.EmployeeId).trim() && 
                String(j.Order).trim() !== orderNo && 
                j.Start && (!j.Stop || j.Stop === '' || j.Stop === '-')
            );

            if (otherPendingJob) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Pemberitahuan Tanggungan Order',
                    html: `
                        <div style="font-size:12px; color:#94a3b8; text-align:left; display:flex; flex-direction:column; gap:6px;">
                            <p>Anda masih memiliki tanggungan pekerjaan yang sedang berjalan pada: <b style="color:#38bdf8;">Order #${otherPendingJob.Order}</b>.</p>
                            <p>Mulai: <b style="color:#fff;">${otherPendingJob.Start}</b> (${otherPendingJob.DateStart || ''})</p>
                            <p class="text-white/60 mt-1">Apakah Anda tetap ingin melanjutkan bekerja untuk order saat ini (#${orderNo})?</p>
                        </div>
                    `,
                    background: '#151921',
                    confirmButtonText: 'Lanjutkan Order Ini',
                    confirmButtonColor: '#0ea5e9',
                    showCancelButton: true,
                    cancelButtonText: 'Tutup Modul',
                    cancelButtonColor: '#334155'
                }).then((res) => {
                    if (!res.isConfirmed) closePerformJobModal();
                });
            }

            // Saring semua record khusus untuk order saat ini
            const orderJobs = allJobs.filter(j => String(j.Order || '').trim() === orderNo);
            countSpan.innerText = `${orderJobs.length} Records for this Order`;

            // 🚀 AMBIL SESI AKTIF TERAKHIR MILIK USER SENDIRI PADA ORDER INI
            const myUnfinishedJobs = orderJobs.filter(j => 
                String(j.EmployeeId).trim() === String(currentUser.EmployeeId).trim() && 
                j.Start && (!j.Stop || j.Stop === '' || j.Stop === '-')
            );

            // Ambil baris yang paling baru
            const latestSession = myUnfinishedJobs.length > 0 ? myUnfinishedJobs[myUnfinishedJobs.length - 1] : null;

            if (latestSession && secondsElapsed === 0) {
                isExistingSession = true;
                dateStartStr = latestSession.DateStart || getCurrentDateIso();
                timeStartStr = latestSession.Start;
                document.getElementById('stamp-start').innerText = timeStartStr;

                // KONDISI A: TERSIMPAN DALAM KEADAAN PAUSE
                if (latestSession.Pause && (!latestSession.Stop || latestSession.Stop === '')) {
                    datePauseStr = latestSession.DatePause || '';
                    timePauseStr = latestSession.Pause || '';
                    document.getElementById('stamp-pause').innerText = timePauseStr;
                    secondsElapsed = parseInt(latestSession.Duration) || 0;
                    isPaused = true;
                    isRunning = false;

                    document.getElementById('timer-display').innerHTML = formatDurationDisplay(secondsElapsed);
                    document.getElementById('btn-timer-start').disabled = false;
                    document.getElementById('label-start').innerText = "Resume Job";
                    document.getElementById('btn-timer-pause').disabled = true;
                    document.getElementById('btn-timer-stop').disabled = false;

                    Swal.fire({
                        icon: 'info',
                        title: 'Sesi Kerja Dimuat Kembali',
                        text: `Pekerjaan dilanjutkan dalam kondisi Pause (Durasi: ${formatSecToReadable(secondsElapsed)}). Klik 'Resume Job' untuk melanjutkan.`,
                        background: '#151921',
                        color: '#fff',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } 
                // KONDISI B: TERSIMPAN DALAM KEADAAN RUNNING (HITUNG SELISIH WAKTU OTOMATIS)
                else {
                    const startMs = parseDateToMs(dateStartStr, timeStartStr);
                    const nowMs = Date.now();

                    if (startMs && nowMs > startMs) {
                        secondsElapsed = Math.floor((nowMs - startMs) / 1000);
                    } else {
                        secondsElapsed = parseInt(latestSession.Duration) || 0;
                    }

                    document.getElementById('timer-display').innerHTML = formatDurationDisplay(secondsElapsed);
                    
                    // Langsung jalankan timer kembali tanpa memicu dialog start awal
                    startTimerTicker();

                    Swal.fire({
                        icon: 'info',
                        title: 'Sesi Berjalan Dipulihkan',
                        text: `Timer langsung dilanjutkan dari jam mulai ${timeStartStr} (Berjalan: ${formatSecToReadable(secondsElapsed)}).`,
                        background: '#151921',
                        color: '#fff',
                        timer: 2000,
                        showConfirmButton: false
                    });
                }
            }

            // 🚀 PERIKSA APAKAH ADA ORANG LAIN YANG JUGA SEDANG MENGERJAKAN ORDER INI
            const otherActiveWorker = orderJobs.find(j => 
                String(j.EmployeeId).trim() !== String(currentUser.EmployeeId).trim() && 
                j.Start && (!j.Stop || j.Stop === '' || j.Stop === '-')
            );

            if (otherActiveWorker && !latestSession && secondsElapsed === 0) {
                const uObj = allUsers.find(usr => String(usr.EmployeeId).trim() === String(otherActiveWorker.EmployeeId).trim());
                const workerName = uObj ? uObj.Name : otherActiveWorker.EmployeeId;

                Swal.fire({
                    icon: 'question',
                    title: 'Active Job Collaboration',
                    html: `
                        <div style="font-size:12px; color:#94a3b8; text-align:left; display:flex; flex-direction:column; gap:6px;">
                            <p>Order #${orderNo} sedang aktif dikerjakan oleh: <b style="color:#fff;">${workerName}</b> (${otherActiveWorker.EmployeeId}).</p>
                            <p style="color:#38bdf8; font-weight:700; margin-top:4px;">Do you part of this job?</p>
                        </div>
                    `,
                    background: '#151921',
                    showCancelButton: true,
                    confirmButtonText: 'Yes, I am part of this job',
                    confirmButtonColor: '#0ea5e9',
                    cancelButtonText: 'No, Exit',
                    cancelButtonColor: '#334155'
                }).then((r) => {
                    if (!r.isConfirmed) closePerformJobModal();
                });
            }

            if (orderJobs.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-white/30 font-mono italic bg-black/20 border border-white/5 rounded-2xl">
                        Belum ada riwayat pengerjaan pada Order #${orderNo} di sheet JOB RECORD.
                    </div>`;
                return;
            }

            // Gabungkan data dengan tabel USER untuk Nama & Class Karyawan
            const enrichedJobs = orderJobs.map(j => {
                const u = allUsers.find(usr => String(usr.EmployeeId).trim() === String(j.EmployeeId).trim()) || {};
                let statusLabel = 'COMPLETED';
                let statusColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

                if (!j.Stop || j.Stop === '' || j.Stop === '-') {
                    if (j.Pause) {
                        statusLabel = 'PAUSED';
                        statusColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                    } else {
                        statusLabel = 'IN PROGRESS';
                        statusColor = 'bg-sky-500/10 text-sky-400 border-sky-500/20 animate-pulse';
                    }
                }

                return {
                    ...j,
                    Name: u.Name || 'Unknown Personnel',
                    Class: (u.Class || 'Employee').trim(),
                    statusLabel,
                    statusColor
                };
            });

            // Kelompokkan berdasarkan Class
            const groupedByClass = enrichedJobs.reduce((acc, j) => {
                if (!acc[j.Class]) acc[j.Class] = [];
                acc[j.Class].push(j);
                return acc;
            }, {});

            // Render Akordeon Bersarang: Setiap Class Bisa Dihide/Expand
            container.innerHTML = Object.entries(groupedByClass).map(([className, jobList]) => {
                const c = getDynamicColor(className);
                return `
                    <details open class="group bg-black/30 border border-white/5 rounded-2xl p-4 transition-all">
                        <summary class="flex justify-between items-center cursor-pointer select-none mb-3">
                            <div class="flex items-center gap-2">
                                <i data-lucide="chevron-down" class="w-3.5 h-3.5 ${c.text} group-open:rotate-180 transition-transform"></i>
                                <span class="font-bold text-xs uppercase tracking-wider ${c.text}">Class: ${className}</span>
                            </div>
                            <span class="${c.badge} font-mono text-[9px] font-bold px-2 py-0.5 rounded-md">${jobList.length} Records</span>
                        </summary>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-[11px] border-collapse">
                                <thead>
                                    <tr class="border-b border-white/10 text-[9px] uppercase font-bold text-white/40">
                                        <th class="py-2 px-3 w-10 text-center">NO.</th>
                                        <th class="py-2 px-3">Personnel Name & ID</th>
                                        <th class="py-2 px-3">Start</th>
                                        <th class="py-2 px-3">Stop</th>
                                        <th class="py-2 px-3 font-mono">Duration</th>
                                        <th class="py-2 px-3 text-right">Status</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5 font-mono">
                                    ${jobList.map((j, idx) => `
                                        <tr class="hover:bg-white/[0.02] transition">
                                            <td class="py-2 px-3 text-center text-white/30 text-[10px]">${idx + 1}</td>
                                            <td class="py-2 px-3 font-sans">
                                                <div class="font-bold text-white">${j.Name}</div>
                                                <div class="text-[9px] text-sky-400/80 font-mono">${j.EmployeeId}</div>
                                            </td>
                                            <td class="py-2 px-3 text-white/70 text-[10px]">
                                                <div>${j.Start || '-'}</div>
                                                <div class="text-[8px] text-white/30">${j.DateStart || ''}</div>
                                            </td>
                                            <td class="py-2 px-3 text-white/70 text-[10px]">
                                                <div>${j.Stop || '-'}</div>
                                                <div class="text-[8px] text-white/30">${j.DateStop || ''}</div>
                                            </td>
                                            <td class="py-2 px-3 text-emerald-400 font-bold text-[10px]">
                                                ${formatSecToReadable(j.Duration)}
                                                <span class="text-[8px] opacity-40 font-normal text-white">(${j.Duration || 0}s)</span>
                                            </td>
                                            <td class="py-2 px-3 text-right">
                                                <span class="px-2 py-0.5 rounded text-[8px] font-bold uppercase tracking-tighter border ${j.statusColor}">
                                                    ${j.statusLabel}
                                                </span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </details>
                `;
            }).join('');

            lucide.createIcons();
        } catch(err) {
            console.error(err);
            container.innerHTML = `<div class="p-6 text-center text-red-400/50 font-mono text-xs">Gagal memuat riwayat JOB RECORD</div>`;
        }
    }

    // Fungsi internal untuk menyalakan interval timer
    function startTimerTicker() {
        isRunning = true;
        isPaused = false;
        document.getElementById('btn-timer-start').disabled = true;
        document.getElementById('btn-timer-pause').disabled = false;
        document.getElementById('btn-timer-stop').disabled = false;

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            secondsElapsed++;
            document.getElementById('timer-display').innerHTML = formatDurationDisplay(secondsElapsed);
        }, 1000);
    }

    // --- WORKFLOW TIMER: START, PAUSE, STOP SECARA REAL-TIME ---
    window.handleStartJob = async function() {
        // Jika sesi belum pernah dimulai sama sekali
        if (!isExistingSession && secondsElapsed === 0) {
            const { isConfirmed } = await Swal.fire({
                title: `<span style="font-size:16px; color:#fff;">Perform Order #${orderNo}</span>`,
                html: `
                    <div style="font-size:12px; color:#94a3b8; text-align:left; display:flex; flex-direction:column; gap:6px;">
                        <p>Operator: <b style="color:#fff;">${currentUser.Name}</b> (${currentUser.EmployeeId})</p>
                        <p>Unit Node: <b style="color:#38bdf8;">${unitCode}</b></p>
                        <hr style="border-color:rgba(255,255,255,0.1); margin:4px 0;">
                        <p style="color:#fff; font-weight:700; font-size:13px;">Are you ready to perform this work?</p>
                    </div>
                `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Yes, Start Work',
                confirmButtonColor: '#0ea5e9',
                cancelButtonColor: '#334155',
                background: '#151921'
            });

            if (!isConfirmed) return;

            dateStartStr = getCurrentDateIso();
            timeStartStr = getCurrentTimeClock();
            document.getElementById('stamp-start').innerText = timeStartStr;
            isExistingSession = true;

            // 🚀 REKAM REAL-TIME KE SHEET: MENGISI DATESTART & START
            const payload = {
                tab: 'JOB RECORD',
                action: 'add',
                primaryId: `${currentUser.EmployeeId}|${dateStartStr}|${timeStartStr}|${orderNo}`,
                EmployeeId: currentUser.EmployeeId,
                DateStart: dateStartStr,
                DatePause: '',
                DateStop: '',
                Order: String(orderNo),
                Start: timeStartStr,
                Pause: '',
                Stop: '',
                Duration: 0
            };
            API.post(payload).catch(console.error);
        }

        startTimerTicker();
    };

    window.handlePauseJob = function() {
        if (!isRunning) return;
        clearInterval(timerInterval);
        isRunning = false;
        isPaused = true;

        datePauseStr = getCurrentDateIso();
        timePauseStr = getCurrentTimeClock();
        document.getElementById('stamp-pause').innerText = timePauseStr;

        document.getElementById('btn-timer-start').disabled = false;
        document.getElementById('label-start').innerText = "Resume Job";
        document.getElementById('btn-timer-pause').disabled = true;

        // 🚀 REKAM REAL-TIME KE SHEET: MENGISI DATEPAUSE, PAUSE & DURASI SEMENTARA
        const payload = {
            tab: 'JOB RECORD',
            action: 'update',
            primaryId: `${currentUser.EmployeeId}|${dateStartStr}|${timeStartStr}|${orderNo}`,
            EmployeeId: currentUser.EmployeeId,
            DateStart: dateStartStr,
            DatePause: datePauseStr,
            DateStop: '',
            Order: String(orderNo),
            Start: timeStartStr,
            Pause: timePauseStr,
            Stop: '',
            Duration: secondsElapsed
        };
        API.post(payload).catch(console.error);
    };

    window.handleStopJob = async function() {
        if (secondsElapsed === 0 && !isExistingSession) return;

        clearInterval(timerInterval);
        isRunning = false;

        dateStopStr = getCurrentDateIso();
        timeStopStr = getCurrentTimeClock();
        document.getElementById('stamp-stop').innerText = timeStopStr;

        const readableDur = formatSecToReadable(secondsElapsed);
        const isTcrUnit = ['TCR-1', 'TCR-2', 'TCR-3', 'TCR-4', 'TCR-5'].includes(unitCode);

        // 🚀 DIALOG KONFIRMASI STATUS, REMARK & PENYIMPANAN FINAL
        const { value: formResult } = await Swal.fire({
            title: `<span style="font-size:16px; color:#fff;">Stop Work & Commit Record</span>`,
            html: `
                <div style="font-size:11px; color:#94a3b8; text-align:left; display:flex; flex-direction:column; gap:10px;">
                    <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,0.08);">
                        <p>Operator: <b style="color:#fff;">${currentUser.Name}</b> (${currentUser.EmployeeId})</p>
                        <p>Order No: <b style="color:#38bdf8;">#${orderNo}</b></p>
                        <p>Durasi Kerja: <b style="color:#4ade80;">${readableDur}</b> (${secondsElapsed} detik)</p>
                    </div>

                    <div>
                        <label style="font-size:10px; font-weight:700; text-transform:uppercase; color:#fff; display:block; margin-bottom:4px;">Status Pekerjaan</label>
                        <select id="swal-stop-status" style="width:100%; background:#0b0e14; color:#fff; border:1px solid #334155; padding:8px; border-radius:8px; font-size:11px; outline:none;">
                            <option value="CLOSED">CLOSED</option>
                            <option value="PROGRESS" selected>PROGRESS</option>
                            <option value="OPEN">OPEN</option>
                        </select>
                    </div>

                    <div>
                        <label style="font-size:10px; font-weight:700; text-transform:uppercase; color:#fff; display:block; margin-bottom:4px;">Work Remark</label>
                        <textarea id="swal-stop-remark" placeholder="Tuliskan remark/catatan pengerjaan..." style="width:100%; height:60px; background:#0b0e14; color:#fff; border:1px solid #334155; padding:8px; border-radius:8px; font-size:11px; outline:none; resize:none;"></textarea>
                    </div>
                </div>
            `,
            background: '#151921',
            showCancelButton: true,
            confirmButtonText: 'Commit Record',
            confirmButtonColor: '#ef4444',
            cancelButtonText: 'Lanjutkan Kerja',
            cancelButtonColor: '#334155',
            preConfirm: () => {
                return {
                    status: document.getElementById('swal-stop-status').value,
                    remark: document.getElementById('swal-stop-remark').value.trim()
                };
            }
        });

        if (!formResult) {
            startTimerTicker();
            return;
        }

        try {
            Swal.fire({
                title: 'Saving Final Record...',
                html: '<div class="text-xs text-white/50">Menyimpan durasi ke Sheet & memperbarui status...</div>',
                allowOutsideClick: false,
                background: '#151921',
                didOpen: () => Swal.showLoading()
            });

            // 🚀 1. UPDATE SUPABASE KHUSUS TCR-1 S/D TCR-5 DENGAN VALIDASI ID
            if (isTcrUnit) {
                const client = sbClient || (window.parent && window.parent.supabaseClient);
                const mapInfo = SUPABASE_MAP[unitCode];

                if (client && mapInfo) {
                    const sbPayload = {};
                    sbPayload[mapInfo.colStatus] = formResult.status.toUpperCase();
                    sbPayload[mapInfo.remarkKey] = formResult.remark;

                    if (formResult.status.toUpperCase() === 'CLOSED') {
                        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                        const d = new Date();
                        sbPayload[mapInfo.colDate] = `${String(d.getDate()).padStart(2,'0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
                    } else {
                        sbPayload[mapInfo.colDate] = null;
                    }

                    let query = client.from('mntp_tcr').update(sbPayload);
                    if (jobContext.supabaseId) {
                        query = query.eq('id', jobContext.supabaseId);
                    } else {
                        const numericOrder = isNaN(orderNo) ? orderNo : Number(orderNo);
                        query = query.eq('order', numericOrder);
                    }

                    const { error: sbErr } = await query;
                    if (sbErr) {
                        console.error("Supabase sync failed:", sbErr);
                        throw new Error("Gagal update data di Supabase: " + (sbErr.message || sbErr));
                    }
                    console.log("✔ Supabase status & remark updated successfully!");
                }
            } else if (unitCode === 'TCP-9') {
                // Khusus TCP-9 update status_job & remark di Supabase
                const client = sbClient || (window.parent && window.parent.supabaseClient);
                if (client) {
                    let query = client.from('mntp_tcr').update({
                        status_job: formResult.status.toUpperCase(),
                        remark: formResult.remark
                    });
                    if (jobContext.supabaseId) {
                        query = query.eq('id', jobContext.supabaseId);
                    } else {
                        const numericOrder = isNaN(orderNo) ? orderNo : Number(orderNo);
                        query = query.eq('order', numericOrder);
                    }
                    await query;
                }
            } else {
                // Unit Google Sheet (misal TCP-10)
                await API.post({
                    tab: 'Operational Detail',
                    action: 'update',
                    primaryId: orderNo,
                    Status: formResult.status,
                    Remark: formResult.remark,
                    Remarks: formResult.remark
                });
            }

            // 🚀 2. REKAM FINAL KE GOOGLE SHEET JOB RECORD
            const payload = {
                tab: 'JOB RECORD',
                action: 'update',
                primaryId: `${currentUser.EmployeeId}|${dateStartStr}|${timeStartStr}|${orderNo}`,
                EmployeeId: currentUser.EmployeeId,
                DateStart: dateStartStr,
                DatePause: datePauseStr || '',
                DateStop: dateStopStr,
                Order: String(orderNo),
                Start: timeStartStr,
                Pause: timePauseStr || '',
                Stop: timeStopStr,
                Duration: secondsElapsed // Integer detik murni
            };

            const res = await API.post(payload);
            if (!res || res.status !== 'success') {
                throw new Error(res?.message || 'Gagal menyimpan ke sheet JOB RECORD.');
            }

            // 🚀 3. SELESAI, TUTUP MODAL & REFRESH DASHBOARD UTAMA
            await Swal.fire({
                icon: 'success',
                title: 'Work Completed & Saved',
                text: `Durasi ${readableDur} tercatat & status diubah ke ${formResult.status}.`,
                background: '#151921',
                color: '#fff',
                confirmButtonColor: '#0ea5e9'
            });

            // Tutup modal
            isExistingSession = false;
            secondsElapsed = 0;
            const modal = document.getElementById('performJobModal');
            if (modal) modal.remove();

            // Refresh data dan tabel di halaman utama Operational Detail secara live
            if (typeof window.init === 'function') {
                window.init();
            }

        } catch(err) {
            console.error("Stop job error:", err);
            Swal.fire({
                title: 'Gagal Menyimpan',
                text: err.message || 'Terjadi kesalahan sistem.',
                icon: 'error',
                background: '#151921',
                color: '#fff'
            });
            startTimerTicker(); // Lanjutkan timer jika gagal simpan
        }
    };

    // Jalankan pemeriksaan awal dan muat riwayat tabel saat modal dibuka
    loadJobRecordsHistory();
})();
</script>
